# Sveltia CMS config for the Yres wiki — i18n (NL + EN in one entry).
#
# Content lives in locale root folders (nl/docs/…, en/docs/…) so Sveltia can
# pair the two languages. In the editor you switch NL↔EN with the locale
# switcher; a missing translation is pre-filled from NL and can be auto-filled
# with the built-in AI translation (pick a provider + paste an API key in the
# CMS Settings — e.g. Anthropic Claude).
#
# Edits commit to main on GitHub; the Deploy-wiki Action builds + publishes.

backend:
  name: github
  repo: danielsand1984/yres-wiki
  branch: main
  base_url: https://oogopdata.nl
  auth_endpoint: api/cms-auth
  commit_messages:
    create: 'CMS: nieuwe pagina {{slug}}'
    update: 'CMS: bewerk {{slug}}'
    delete: 'CMS: verwijder {{slug}}'
    uploadMedia: 'CMS: upload {{path}}'
    deleteMedia: 'CMS: verwijder media {{path}}'

media_folder: 'static/img/uploads'
public_folder: '/img/uploads'

publish_mode: simple

# NL + EN paired. Content at nl/docs/… and en/docs/…
i18n:
  structure: multiple_root_folders
  locales: [nl, en]
  default_locale: nl

collections:
  - name: 'algemeen'
    label: 'Algemeen'
    folder: 'docs'
    extension: 'md'
    format: 'frontmatter'
    create: true
    i18n: true
    fields: &fields
      - { label: 'Titel', name: 'title', widget: 'string', required: false, i18n: true }
      - { label: 'Sidebar-label', name: 'sidebar_label', widget: 'string', required: false, i18n: true }
      - { label: 'Sidebar-positie', name: 'sidebar_position', widget: 'number', required: false, value_type: 'int', min: 1, i18n: duplicate }
      - { label: 'Slug (URL)', name: 'slug', widget: 'string', required: false, i18n: duplicate }
      - { label: 'Inhoud', name: 'body', widget: 'markdown', i18n: true }
  - { name: 'product', label: 'Product', folder: 'docs/product', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'concepten', label: 'Concepten', folder: 'docs/concepten', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'architectuur', label: 'Architectuur', folder: 'docs/architectuur', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'frontend', label: 'Gebruik (frontend)', folder: 'docs/frontend', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'setup', label: 'Setup & installatie', folder: 'docs/setup', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'integraties', label: 'Integraties & databronnen', folder: 'docs/integraties', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'bronnen', label: 'Integraties · Bronnen', folder: 'docs/integraties/bronnen', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'referentie', label: 'Referentie', folder: 'docs/referentie', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'sql', label: 'Referentie · SQL', folder: 'docs/referentie/sql', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'klanten', label: 'Klanten', folder: 'docs/klanten', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
  - { name: 'team', label: 'Team & processen', folder: 'docs/team', extension: 'md', format: 'frontmatter', create: true, i18n: true, fields: *fields }
