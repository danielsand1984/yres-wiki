<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>

  <!-- top bar (superadmin: title "SuperAdmin Yres", no env switcher / no help) -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">SuperAdmin Yres &#8250; Organizations &#8250; Create organization</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail (superadmin: single "Super Admin" main link near y=700, amber active) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78"  width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161" fill="#8a9196">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
    <!-- active Super Admin item (y=700) -->
    <g><rect x="14" y="700" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="725" fill="#1c1c1e">Super</text><text x="34" y="734" fill="#1c1c1e">Admin</text></g>
  </g>

  <!-- sub-sidebar (superadmin sub-links) -->
  <rect x="68" y="56" width="150" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="84" y="150" font-size="11.5" font-weight="700" fill="#5b6166">SUPER ADMIN</text>
  <text x="84" y="178" font-size="11.5" fill="#1c7ed6">Admin panel</text>
  <text x="84" y="204" font-size="11.5" fill="#2b2b2e">Audit logs</text>
  <text x="84" y="230" font-size="11.5" fill="#2b2b2e">Announcements</text>
  <text x="84" y="256" font-size="11.5" fill="#2b2b2e">Plans</text>
  <text x="84" y="282" font-size="11.5" fill="#2b2b2e">Deployments</text>
  <text x="84" y="308" font-size="11.5" fill="#2b2b2e">Invitations</text>
  <text x="84" y="334" font-size="11.5" fill="#2b2b2e">Translations</text>
  <text x="84" y="360" font-size="11.5" fill="#2b2b2e">Webapp keys</text>

  <!-- page title -->
  <text x="240" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Create new organization</text>
  <text x="240" y="114" font-size="12.5" fill="#8a9196">7-step wizard provisions a new tenant: org + Azure + resources + environments + DWH database. Step 1 of 7.</text>

  <!-- ===== left: step rail (the 7 wizard steps with real titles) ===== -->
  <rect x="240" y="134" width="300" height="630" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="262" y="162" font-size="13" font-weight="700" fill="#1c1c1e">Steps</text>
  <line x1="240" y1="176" x2="540" y2="176" stroke="#eef3f4"/>

  <!-- connector spine -->
  <line x1="278" y1="206" x2="278" y2="710" stroke="#e3e8ea" stroke-width="2"/>

  <!-- step 1 active -->
  <circle cx="278" cy="206" r="13" fill="#FBAF42"/>
  <text x="278" y="211" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <text x="304" y="203" font-size="12.5" font-weight="700" fill="#1c1c1e">Organization and project</text>
  <text x="304" y="219" font-size="10.5" fill="#8a9196">Org name, project, subdomain</text>

  <!-- step 2 -->
  <circle cx="278" cy="278" r="13" fill="#ffffff" stroke="#8a9196" stroke-width="1.5"/>
  <text x="278" y="283" font-size="13" font-weight="700" fill="#8a9196" text-anchor="middle">2</text>
  <text x="304" y="275" font-size="12.5" font-weight="600" fill="#2b2b2e">Plan and version</text>
  <text x="304" y="291" font-size="10.5" fill="#8a9196">Select plan and Yres version</text>

  <!-- step 3 -->
  <circle cx="278" cy="350" r="13" fill="#ffffff" stroke="#8a9196" stroke-width="1.5"/>
  <text x="278" y="355" font-size="13" font-weight="700" fill="#8a9196" text-anchor="middle">3</text>
  <text x="304" y="347" font-size="12.5" font-weight="600" fill="#2b2b2e">UpdateEnvironments</text>
  <text x="304" y="363" font-size="10.5" fill="#8a9196">Dev and prod required (max 6)</text>

  <!-- step 4 -->
  <circle cx="278" cy="422" r="13" fill="#ffffff" stroke="#8a9196" stroke-width="1.5"/>
  <text x="278" y="427" font-size="13" font-weight="700" fill="#8a9196" text-anchor="middle">4</text>
  <text x="304" y="419" font-size="12.5" font-weight="600" fill="#2b2b2e">Custom Database</text>
  <text x="304" y="435" font-size="10.5" fill="#8a9196">Use a custom SQL database?</text>

  <!-- step 5 -->
  <circle cx="278" cy="494" r="13" fill="#ffffff" stroke="#8a9196" stroke-width="1.5"/>
  <text x="278" y="499" font-size="13" font-weight="700" fill="#8a9196" text-anchor="middle">5</text>
  <text x="304" y="491" font-size="12.5" font-weight="600" fill="#2b2b2e">Resource names</text>
  <text x="304" y="507" font-size="10.5" fill="#8a9196">Fill $ for the environment name</text>

  <!-- step 6 -->
  <circle cx="278" cy="566" r="13" fill="#ffffff" stroke="#8a9196" stroke-width="1.5"/>
  <text x="278" y="571" font-size="13" font-weight="700" fill="#8a9196" text-anchor="middle">6</text>
  <text x="304" y="563" font-size="12.5" font-weight="600" fill="#2b2b2e">Setup azure</text>
  <text x="304" y="579" font-size="10.5" fill="#8a9196">AD app: DevOps, KeyVault perms</text>

  <!-- step 7 -->
  <circle cx="278" cy="638" r="13" fill="#ffffff" stroke="#8a9196" stroke-width="1.5"/>
  <text x="278" y="643" font-size="13" font-weight="700" fill="#8a9196" text-anchor="middle">7</text>
  <text x="304" y="635" font-size="12.5" font-weight="600" fill="#2b2b2e">Setup azure 2: permissions</text>
  <text x="304" y="651" font-size="10.5" fill="#8a9196">Resource groups + owner rights</text>

  <!-- resource-name preview chips (defaults from ResourcesStep) -->
  <line x1="240" y1="676" x2="540" y2="676" stroke="#eef3f4"/>
  <text x="262" y="698" font-size="10.5" fill="#8a9196">Default resource names (step 5):</text>
  <rect x="262" y="708" width="86" height="18" rx="4" fill="#FEF1DD"/><text x="305" y="721" font-size="10" fill="#e89a1f" text-anchor="middle">rg-yres-$</text>
  <rect x="354" y="708" width="86" height="18" rx="4" fill="#FEF1DD"/><text x="397" y="721" font-size="10" fill="#e89a1f" text-anchor="middle">kv-yres-$</text>
  <rect x="446" y="708" width="80" height="18" rx="4" fill="#FEF1DD"/><text x="486" y="721" font-size="10" fill="#e89a1f" text-anchor="middle">adf-yres-$</text>
  <rect x="262" y="732" width="96" height="18" rx="4" fill="#FEF1DD"/><text x="310" y="745" font-size="10" fill="#e89a1f" text-anchor="middle">sqlsrv-yres-$</text>
  <rect x="364" y="732" width="96" height="18" rx="4" fill="#FEF1DD"/><text x="412" y="745" font-size="10" fill="#e89a1f" text-anchor="middle">sqldb-yres-$</text>

  <!-- ===== right: active step form card (Organization and project) ===== -->
  <rect x="560" y="134" width="640" height="630" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="584" y="166" font-size="16" font-weight="700" fill="#1c1c1e">Organization and project</text>
  <text x="584" y="186" font-size="11.5" fill="#8a9196">Name the tenant and its first project. The subdomain is derived from the name.</text>
  <line x1="560" y1="200" x2="1200" y2="200" stroke="#e3e8ea"/>

  <!-- Organization name -->
  <text x="584" y="232" font-size="11" fill="#8a9196">Organization name</text>
  <rect x="584" y="238" width="592" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="598" y="260" font-size="12.5" fill="#1c1c1e">Acme B.V.</text>

  <!-- Project name -->
  <text x="584" y="296" font-size="11" fill="#8a9196">Project name</text>
  <rect x="584" y="302" width="592" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="598" y="324" font-size="12.5" fill="#1c1c1e">acme-data-platform</text>
  <text x="1162" y="324" font-size="10.5" fill="#8a9196" text-anchor="end">lowercase + hyphens only</text>

  <!-- Subdomain + Edit + .yres.app suffix -->
  <text x="584" y="360" font-size="11" fill="#8a9196">Subdomain</text>
  <rect x="584" y="366" width="488" height="34" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="598" y="388" font-size="12.5" fill="#2b2b2e">acme</text>
  <text x="1058" y="388" font-size="12" font-weight="600" fill="#8a9196" text-anchor="end">.yres.app</text>
  <rect x="1084" y="366" width="92" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1130" y="388" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Edit</text>

  <!-- preview / context note: what later steps will create -->
  <rect x="584" y="430" width="592" height="196" rx="8" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="606" y="456" font-size="12" font-weight="700" fill="#1c1c1e">This wizard will provision</text>

  <text x="606" y="484" font-size="11.5" fill="#8a9196">Environments</text>
  <rect x="606" y="492" width="78" height="20" rx="4" fill="#FEF1DD"/><text x="645" y="506" font-size="10.5" fill="#e89a1f" text-anchor="middle">dev</text>
  <rect x="690" y="492" width="96" height="20" rx="4" fill="#FEF1DD"/><text x="738" y="506" font-size="10.5" fill="#e89a1f" text-anchor="middle">Productie</text>

  <text x="606" y="540" font-size="11.5" fill="#8a9196">Per-environment Azure resources</text>
  <text x="606" y="560" font-size="11.5" fill="#2b2b2e">Resource group &#183; Key vault &#183; SQL server &#183; ADF &#183; Storage &#183; Data lake</text>

  <text x="606" y="588" font-size="11.5" fill="#8a9196">IRIS_DWH database schemas</text>
  <rect x="606" y="596" width="72" height="20" rx="4" fill="#FEF1DD"/><text x="642" y="610" font-size="10.5" fill="#e89a1f" text-anchor="middle">STAGE</text>
  <rect x="684" y="596" width="60" height="20" rx="4" fill="#FEF1DD"/><text x="714" y="610" font-size="10.5" fill="#e89a1f" text-anchor="middle">HIS</text>
  <rect x="750" y="596" width="74" height="20" rx="4" fill="#FEF1DD"/><text x="787" y="610" font-size="10.5" fill="#e89a1f" text-anchor="middle">Expose</text>

  <!-- footer buttons -->
  <line x1="560" y1="710" x2="1200" y2="710" stroke="#e3e8ea"/>
  <rect x="940" y="722" width="92" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="986" y="744" font-size="12.5" font-weight="600" fill="#8a9196" text-anchor="middle">Back</text>
  <rect x="1044" y="722" width="132" height="34" rx="6" fill="#FBAF42"/>
  <text x="1110" y="744" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Next &#8594;</text>

  <!-- ===== CALLOUTS ===== -->
  <!-- 1: active step / progress -->
  <circle cx="258" cy="206" r="11" fill="#FBAF42"/><text x="258" y="210" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: Organization name -->
  <circle cx="1190" cy="255" r="11" fill="#FBAF42"/><text x="1190" y="259" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: subdomain + .yres.app + Edit -->
  <circle cx="1130" cy="350" r="11" fill="#FBAF42"/><text x="1130" y="354" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: environments preview (dev/prod required) -->
  <circle cx="800" cy="502" r="11" fill="#FBAF42"/><text x="800" y="506" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: resource names defaults -->
  <circle cx="540" cy="717" r="11" fill="#FBAF42"/><text x="540" y="721" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: Next -->
  <circle cx="1044" cy="722" r="11" fill="#FBAF42"/><text x="1044" y="726" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ===== legend ===== -->
  <text x="240" y="784" font-size="11" fill="#2b2b2e">1 step rail (1&#8211;7) &#183; 2 Organization name &#183; 3 Subdomain .yres.app + Edit &#183; 4 dev/prod required &#183; 5 resource-name $ defaults &#183; 6 Next advances to Plan and version.</text>
</svg>
