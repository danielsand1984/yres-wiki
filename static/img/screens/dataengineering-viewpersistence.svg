<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Data engineering / View persistence</text>
  <!-- env switcher (top-right) -->
  <rect x="940" y="14" width="170" height="28" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="954" y="32" font-size="12" fill="#2b2b2e">Acme B.V. · Productie ▾</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail (sections) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161" fill="#8a9196">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="277" fill="#1c1c1e">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
  </g>

  <!-- sub-link sidebar (Data engineering) -->
  <rect x="68" y="56" width="150" height="744" fill="#ffffff" stroke="#e3e8ea"/>
  <g font-size="11.5" fill="#5b6166">
    <text x="84" y="86" font-size="10" font-weight="700" fill="#8a9196" letter-spacing="0.5">DATA ENGINEERING</text>
    <rect x="74" y="100" width="138" height="26" rx="6" fill="#FEF1DD"/>
    <text x="84" y="118" font-weight="600" fill="#e89a1f">View persistence</text>
    <text x="84" y="148">Object history</text>
  </g>

  <!-- page title -->
  <text x="244" y="92" font-size="20" font-weight="700" fill="#1c1c1e">View persistence</text>
  <text x="244" y="114" font-size="12.5" fill="#8a9196">Persist (materialize) DWH views into tables; run the Materialize View pipeline</text>

  <!-- ============ MAIN ============ -->

  <!-- persistence table card -->
  <rect x="244" y="140" width="956" height="430" rx="8" fill="#ffffff" stroke="#e3e8ea"/>

  <!-- table title row -->
  <text x="264" y="170" font-size="13.5" font-weight="700" fill="#1c1c1e">View persistence</text>
  <text x="264" y="186" font-size="10.5" fill="#8a9196">Loadmanagement.vwViewPersistence</text>

  <!-- Run materialize view (all) button -->
  <rect x="940" y="150" width="242" height="32" rx="6" fill="#FBAF42"/>
  <rect x="956" y="159" width="14" height="14" rx="2" fill="none" stroke="#1c1c1e" stroke-width="1.4"/><path d="M963 162v8M959 166h8" stroke="#1c1c1e" stroke-width="1.4"/>
  <text x="980" y="171" font-size="12" font-weight="600" fill="#1c1c1e">Run materialize view (all)</text>

  <!-- table header band -->
  <rect x="244" y="200" width="956" height="34" fill="#eef3f4"/>
  <g font-size="11" font-weight="600" fill="#5b6166">
    <text x="264" y="221">SourceSchemaName</text>
    <text x="380" y="221">SourceViewName</text>
    <text x="510" y="221">DestinationSchemaName</text>
    <text x="660" y="221">DestinationTableName</text>
    <text x="810" y="221">Level</text>
    <text x="858" y="221">Delta</text>
    <text x="920" y="221">LastPersistDate</text>
    <text x="1040" y="221">Active</text>
    <text x="1182" y="221" text-anchor="end">actions</text>
  </g>

  <!-- rows -->
  <g font-size="11" fill="#2b2b2e">
    <!-- row 1 -->
    <text x="264" y="256">Expose</text>
    <text x="380" y="256">vwSalesByMonth</text>
    <text x="510" y="256">Expose</text>
    <text x="660" y="256">SalesByMonth</text>
    <text x="810" y="256">1</text>
    <rect x="852" y="244" width="40" height="18" rx="4" fill="#e6f4ea"/><text x="858" y="257" font-size="10" fill="#2f9e44">Delta</text>
    <text x="920" y="256">2026-06-24 02:14</text>
    <rect x="1036" y="244" width="34" height="18" rx="4" fill="#e6f4ea"/><text x="1041" y="257" font-size="10" fill="#2f9e44">Yes</text>
    <!-- run materialize view action -->
    <rect x="1160" y="246" width="16" height="14" rx="2" fill="none" stroke="#1c7ed6" stroke-width="1.4"/><path d="M1166 250v6M1170 250l-4 4-4-4" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="244" y1="270" x2="1200" y2="270" stroke="#eef3f4"/>

    <!-- row 2 -->
    <text x="264" y="292">Expose</text>
    <text x="380" y="292">vwCustomerKPIs</text>
    <text x="510" y="292">Expose</text>
    <text x="660" y="292">CustomerKPIs</text>
    <text x="810" y="292">2</text>
    <rect x="852" y="280" width="40" height="18" rx="4" fill="#e6f4ea"/><text x="858" y="293" font-size="10" fill="#2f9e44">Delta</text>
    <text x="920" y="292">2026-06-24 02:31</text>
    <rect x="1036" y="280" width="34" height="18" rx="4" fill="#e6f4ea"/><text x="1041" y="293" font-size="10" fill="#2f9e44">Yes</text>
    <rect x="1160" y="282" width="16" height="14" rx="2" fill="none" stroke="#1c7ed6" stroke-width="1.4"/><path d="M1166 286v6M1170 286l-4 4-4-4" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="244" y1="306" x2="1200" y2="306" stroke="#eef3f4"/>

    <!-- row 3 -->
    <text x="264" y="328">HIS</text>
    <text x="380" y="328">vwOrderHistory</text>
    <text x="510" y="328">Expose</text>
    <text x="660" y="328">OrderHistory</text>
    <text x="810" y="328">1</text>
    <rect x="852" y="316" width="38" height="18" rx="4" fill="#eef3f4"/><text x="858" y="329" font-size="10" fill="#5b6166">Full</text>
    <text x="920" y="328">2026-06-23 23:05</text>
    <rect x="1036" y="316" width="34" height="18" rx="4" fill="#e6f4ea"/><text x="1041" y="329" font-size="10" fill="#2f9e44">Yes</text>
    <rect x="1160" y="318" width="16" height="14" rx="2" fill="none" stroke="#1c7ed6" stroke-width="1.4"/><path d="M1166 322v6M1170 322l-4 4-4-4" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="244" y1="342" x2="1200" y2="342" stroke="#eef3f4"/>

    <!-- row 4 -->
    <text x="264" y="364">STAGE</text>
    <text x="380" y="364">vwAfasDebtors</text>
    <text x="510" y="364">Expose</text>
    <text x="660" y="364">AfasDebtors</text>
    <text x="810" y="364">0</text>
    <rect x="852" y="352" width="40" height="18" rx="4" fill="#e6f4ea"/><text x="858" y="365" font-size="10" fill="#2f9e44">Delta</text>
    <text x="920" y="364">2026-06-24 01:48</text>
    <rect x="1036" y="352" width="34" height="18" rx="4" fill="#e6f4ea"/><text x="1041" y="365" font-size="10" fill="#2f9e44">Yes</text>
    <rect x="1160" y="354" width="16" height="14" rx="2" fill="none" stroke="#1c7ed6" stroke-width="1.4"/><path d="M1166 358v6M1170 358l-4 4-4-4" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="244" y1="378" x2="1200" y2="378" stroke="#eef3f4"/>

    <!-- row 5 (inactive / greyed) -->
    <text x="264" y="400" fill="#8a9196">Expose</text>
    <text x="380" y="400" fill="#8a9196">vwExactJournals</text>
    <text x="510" y="400" fill="#8a9196">Expose</text>
    <text x="660" y="400" fill="#8a9196">ExactJournals</text>
    <text x="810" y="400" fill="#8a9196">2</text>
    <rect x="852" y="388" width="38" height="18" rx="4" fill="#eef3f4"/><text x="858" y="401" font-size="10" fill="#8a9196">Full</text>
    <text x="920" y="400" fill="#8a9196">—</text>
    <rect x="1036" y="388" width="34" height="18" rx="4" fill="#fde8e8"/><text x="1041" y="401" font-size="10" fill="#e03131">No</text>
    <rect x="1160" y="390" width="16" height="14" rx="2" fill="none" stroke="#8a9196" stroke-width="1.4"/><path d="M1166 394v6M1170 394l-4 4-4-4" stroke="#8a9196" stroke-width="1.4" fill="none"/>
    <line x1="244" y1="414" x2="1200" y2="414" stroke="#eef3f4"/>

    <!-- row 6 -->
    <text x="264" y="436">Expose</text>
    <text x="380" y="436">vwCrmPipeline</text>
    <text x="510" y="436">Expose</text>
    <text x="660" y="436">CrmPipeline</text>
    <text x="810" y="436">1</text>
    <rect x="852" y="424" width="40" height="18" rx="4" fill="#e6f4ea"/><text x="858" y="437" font-size="10" fill="#2f9e44">Delta</text>
    <text x="920" y="436">2026-06-24 02:02</text>
    <rect x="1036" y="424" width="34" height="18" rx="4" fill="#e6f4ea"/><text x="1041" y="437" font-size="10" fill="#2f9e44">Yes</text>
    <rect x="1160" y="426" width="16" height="14" rx="2" fill="none" stroke="#1c7ed6" stroke-width="1.4"/><path d="M1166 430v6M1170 430l-4 4-4-4" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="244" y1="450" x2="1200" y2="450" stroke="#eef3f4"/>
  </g>

  <!-- + Add row hint -->
  <text x="264" y="476" font-size="11.5" font-weight="600" fill="#e89a1f">+ Add persisted view</text>

  <!-- footnote about source object delta -->
  <text x="264" y="544" font-size="10.5" fill="#8a9196">Delta rows track changes via a SourceObject (view/table) + DeltaColumn; full rows re-materialize the whole view each run.</text>

  <!-- ============ MaintainPersistView form (CrudModal: create) ============ -->
  <rect x="244" y="588" width="956" height="184" rx="8" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="264" y="614" font-size="13" font-weight="700" fill="#1c1c1e">Create persisted view</text>
  <text x="264" y="630" font-size="10.5" fill="#8a9196">Step 1 of 2 · Source → Destination · then choose load type</text>

  <!-- Source schema / view -->
  <text x="264" y="652" font-size="11" fill="#8a9196">SourceSchemaName</text>
  <rect x="264" y="658" width="216" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="276" y="677" font-size="11.5" fill="#2b2b2e">Expose ▾</text>
  <text x="496" y="652" font-size="11" fill="#8a9196">SourceViewName</text>
  <rect x="496" y="658" width="244" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="508" y="677" font-size="11.5" fill="#2b2b2e">vwSalesByMonth ▾</text>

  <!-- Destination schema / table -->
  <text x="756" y="652" font-size="11" fill="#8a9196">DestinationSchemaName</text>
  <rect x="756" y="658" width="200" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="768" y="677" font-size="11.5" fill="#2b2b2e">Expose</text>
  <text x="972" y="652" font-size="11" fill="#8a9196">DestinationTableName</text>
  <rect x="972" y="658" width="208" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="984" y="677" font-size="11.5" fill="#2b2b2e">SalesByMonth</text>

  <!-- Level + LoadType (Full/Delta) -->
  <text x="264" y="710" font-size="11" fill="#8a9196">Level</text>
  <rect x="264" y="716" width="120" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="276" y="735" font-size="11.5" fill="#2b2b2e">1</text>
  <text x="400" y="710" font-size="11" fill="#8a9196">LoadType</text>
  <rect x="400" y="716" width="180" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="412" y="735" font-size="11.5" fill="#2b2b2e">Delta ▾</text>
  <text x="596" y="710" font-size="11" fill="#8a9196">SourceDeltaObjectType</text>
  <rect x="596" y="716" width="180" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="608" y="735" font-size="11.5" fill="#2b2b2e">View ▾</text>

  <!-- Cancel + Next/Create buttons -->
  <rect x="952" y="716" width="92" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="998" y="736" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Cancel</text>
  <rect x="1052" y="716" width="128" height="30" rx="6" fill="#FBAF42"/>
  <text x="1116" y="736" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Next: Delta</text>

  <!-- ============ CALLOUTS ============ -->
  <!-- 1: Run materialize view (all) -->
  <circle cx="940" cy="166" r="11" fill="#FBAF42"/><text x="940" y="170" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: persistence table columns -->
  <circle cx="260" cy="217" r="11" fill="#FBAF42"/><text x="260" y="221" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: per-row Run materialize view action -->
  <circle cx="1168" cy="253" r="11" fill="#FBAF42"/><text x="1168" y="257" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: source -> destination form -->
  <circle cx="248" cy="667" r="11" fill="#FBAF42"/><text x="248" y="671" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: Level + LoadType (Full/Delta) -->
  <circle cx="400" cy="731" r="11" fill="#FBAF42"/><text x="400" y="735" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>

  <!-- callout legend -->
  <g font-size="10.5" fill="#5b6166">
    <text x="244" y="784" font-weight="700" fill="#1c1c1e">1</text><text x="256" y="784">Run materialize view (all) — runs the Materialize View pipeline for every row</text>
    <text x="700" y="784" font-weight="700" fill="#1c1c1e">2</text><text x="712" y="784">SourceSchema/View → Destination, Level, Delta, dates, Active</text>
    <text x="244" y="797" font-weight="700" fill="#1c1c1e">3</text><text x="256" y="797">Per-row Run materialize view</text>
    <text x="420" y="797" font-weight="700" fill="#1c1c1e">4</text><text x="432" y="797">Create: pick source view + destination schema/table</text>
    <text x="820" y="797" font-weight="700" fill="#1c1c1e">5</text><text x="832" y="797">Level + LoadType (Full/Delta → source object + DeltaColumn)</text>
  </g>
</svg>
