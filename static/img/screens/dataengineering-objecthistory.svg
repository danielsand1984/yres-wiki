    <text x="809" y="432" fill="#8a9196">4</text><text x="849" y="432" fill="#999">o.Amount * f.Rate AS AmountEUR</text>
    <text x="809" y="452" fill="#8a9196">5</text><text x="836" y="452" fill="#07a">FROM</text><text x="872" y="452" fill="#905">[HIS].[SalesOrders] o</text>
    <text x="809" y="472" fill="#8a9196">6</text><text x="836" y="472" fill="#07a">CROSS APPLY</text><text x="918" y="472" fill="#dd4a68">fnGetExchangeRate</text>
    <text x="836" y="492" fill="#999">(o.Currency) f</text>
    <text x="809" y="512" fill="#8a9196">7</text><text x="836" y="512" fill="#07a">WHERE</text><text x="882" y="512" fill="#999">o.IsCurrent = 1;</text>
