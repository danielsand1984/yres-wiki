    <text x="405" y="372" fill="#8a9196">1</text><text x="432" y="372" fill="#07a">CREATE VIEW</text><text x="510" y="372" fill="#905">[Expose].[vwSalesOrders]</text>
    <text x="405" y="392" fill="#8a9196">2</text><text x="432" y="392" fill="#07a">AS SELECT</text>
    <text x="405" y="412" fill="#8a9196">3</text><text x="445" y="412" fill="#999">o.OrderId, o.CustomerId,</text>
    <rect x="422" y="420" width="368" height="16" fill="#fbdcdc"/>
    <text x="405" y="432" fill="#8a9196">4</text><text x="445" y="432" fill="#999">o.Amount</text>
    <text x="405" y="452" fill="#8a9196">5</text><text x="432" y="452" fill="#07a">FROM</text><text x="468" y="452" fill="#905">[HIS].[SalesOrders] o</text>
    <text x="405" y="472" fill="#8a9196">6</text><text x="432" y="472" fill="#07a">WHERE</text><text x="478" y="472" fill="#999">o.IsCurrent = 1;</text>
  </g>
  <!-- RIGHT (new) -->
  <g font-family="'Cascadia Code', Consolas, monospace" font-size="10.5">
    <text x="809" y="372" fill="#8a9196">1</text><text x="836" y="372" fill="#07a">CREATE VIEW</text><text x="914" y="372" fill="#905">[Expose].[vwSalesOrders]</text>
    <text x="809" y="392" fill="#8a9196">2</text><text x="836" y="392" fill="#07a">AS SELECT</text>
    <text x="809" y="412" fill="#8a9196">3</text><text x="849" y="412" fill="#999">o.OrderId, o.CustomerId,</text>
