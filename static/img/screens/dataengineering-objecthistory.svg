  <text x="106" y="704" font-size="10" fill="#F9B233">▌ amber = Yres/iris-owned object</text>
  <text x="106" y="717" font-size="10" fill="#8a9196">Or right-click a leaf → Add to change /</text>
  <text x="106" y="730" font-size="10" fill="#8a9196">Add with dependencies / Open dependency view</text>

