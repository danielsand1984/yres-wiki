<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Organizations</text>
  <!-- no env switcher on the picker (no org/env selected yet); just user avatar -->
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail (Super Admin section active, y=700) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161" fill="#8a9196">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
    <!-- Super Admin (active) at y=700 -->
    <g><rect x="14" y="686" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="703" font-size="8" fill="#1c1c1e">Super</text><text x="34" y="713" font-size="8" fill="#1c1c1e">Admin</text></g>
  </g>

  <!-- page title -->
  <text x="92" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Select organization</text>
  <text x="92" y="114" font-size="12.5" fill="#8a9196">Pick the organization to enter, accept a pending invitation, or open Super Admin.</text>

  <!-- ===================== MAIN ===================== -->

  <!-- Pending organizations section -->
  <text x="120" y="166" font-size="15" font-weight="700" fill="#1c1c1e">Pending organizations</text>
  <text x="120" y="184" font-size="11.5" fill="#8a9196">Invitations awaiting setup &#8211; click to start tenant creation</text>

  <!-- pending invitation card 1 -->
  <rect x="120" y="198" width="328" height="74" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="284" y="234" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="middle">Northwind Trading B.V.</text>
  <text x="284" y="254" font-size="11.5" fill="#8a9196" text-anchor="middle">Azure - Enterprise</text>

  <!-- pending invitation card 2 -->
  <rect x="472" y="198" width="328" height="74" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="636" y="234" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="middle">Globex Holdings</text>
  <text x="636" y="254" font-size="11.5" fill="#8a9196" text-anchor="middle">Azure - Professional</text>

  <!-- divider -->
  <line x1="120" y1="300" x2="1184" y2="300" stroke="#e3e8ea"/>

  <!-- Select organization section -->
  <text x="120" y="332" font-size="15" font-weight="700" fill="#1c1c1e">Your organizations</text>
  <text x="120" y="350" font-size="11.5" fill="#8a9196">Click a card to enter that tenant (navigates to its subdomain)</text>

  <!-- ===== org cards grid (3 cols) ===== -->

  <!-- Card: Super Admin (admins only) -->
  <rect x="120" y="368" width="328" height="96" rx="8" fill="#FEF1DD" stroke="#e89a1f"/>
  <!-- building icon -->
  <rect x="148" y="396" width="34" height="40" rx="3" fill="#ffffff" stroke="#e89a1f"/>
  <rect x="156" y="404" width="6" height="6" fill="#e89a1f"/><rect x="168" y="404" width="6" height="6" fill="#e89a1f"/>
  <rect x="156" y="416" width="6" height="6" fill="#e89a1f"/><rect x="168" y="416" width="6" height="6" fill="#e89a1f"/>
  <rect x="161" y="426" width="8" height="10" fill="#e89a1f"/>
  <text x="208" y="412" font-size="14" font-weight="700" fill="#1c1c1e">Super Admin</text>
  <text x="208" y="432" font-size="11.5" fill="#e89a1f">Cross-tenant control plane</text>

  <!-- Card: Acme B.V. (Productie) -->
  <rect x="472" y="368" width="328" height="96" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- yres logo placeholder -->
  <circle cx="512" cy="416" r="20" fill="#FBAF42"/><path d="M500 408l12 13 12-13h-7l-5 5-5-5z" fill="#1c1c1e"/><rect x="508" y="421" width="8" height="12" rx="2" fill="#1c1c1e"/>
  <text x="552" y="408" font-size="14" font-weight="700" fill="#1c1c1e">Acme B.V.</text>
  <text x="552" y="430" font-size="11.5" fill="#8a9196">v1.56</text>
  <!-- deploying status (right) -->
  <circle cx="724" cy="424" r="7" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="738" y="428" font-size="11" font-weight="600" fill="#2f9e44">Deploying</text>

  <!-- Card: Contoso Logistics -->
  <rect x="824" y="368" width="328" height="96" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="864" cy="416" r="20" fill="#FBAF42"/><path d="M852 408l12 13 12-13h-7l-5 5-5-5z" fill="#1c1c1e"/><rect x="860" y="421" width="8" height="12" rx="2" fill="#1c1c1e"/>
  <text x="904" y="408" font-size="14" font-weight="700" fill="#1c1c1e">Contoso Logistics</text>
  <text x="904" y="430" font-size="11.5" fill="#8a9196">v1.9</text>

  <!-- Card: Initech N.V. (failed deployment) -->
  <rect x="120" y="492" width="328" height="96" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="160" cy="540" r="20" fill="#FBAF42"/><path d="M148 532l12 13 12-13h-7l-5 5-5-5z" fill="#1c1c1e"/><rect x="156" y="545" width="8" height="12" rx="2" fill="#1c1c1e"/>
  <text x="200" y="532" font-size="14" font-weight="700" fill="#1c1c1e">Initech N.V.</text>
  <text x="200" y="554" font-size="11.5" fill="#8a9196">v1.55</text>
  <!-- failed status (right) -->
  <circle cx="372" cy="548" r="8" fill="none" stroke="#e03131" stroke-width="2"/><text x="372" y="552" font-size="11" font-weight="700" fill="#e03131" text-anchor="middle">!</text>
  <text x="388" y="552" font-size="11" font-weight="600" fill="#e03131">Failed</text>

  <!-- Card: Umbrella Data Group -->
  <rect x="472" y="492" width="328" height="96" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="512" cy="540" r="20" fill="#FBAF42"/><path d="M500 532l12 13 12-13h-7l-5 5-5-5z" fill="#1c1c1e"/><rect x="508" y="545" width="8" height="12" rx="2" fill="#1c1c1e"/>
  <text x="552" y="532" font-size="14" font-weight="700" fill="#1c1c1e">Umbrella Data Group</text>
  <text x="552" y="554" font-size="11.5" fill="#8a9196">v1.56</text>

  <!-- Card: Stark Industries -->
  <rect x="824" y="492" width="328" height="96" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="864" cy="540" r="20" fill="#FBAF42"/><path d="M852 532l12 13 12-13h-7l-5 5-5-5z" fill="#1c1c1e"/><rect x="860" y="545" width="8" height="12" rx="2" fill="#1c1c1e"/>
  <text x="904" y="532" font-size="14" font-weight="700" fill="#1c1c1e">Stark Industries</text>
  <text x="904" y="554" font-size="11.5" fill="#8a9196">v1.54</text>

  <!-- hover hint (one card highlighted on hover = theme color) -->
  <text x="120" y="624" font-size="11" fill="#8a9196">Hover tints a card with the org primary theme colour; click navigates to https://{slug}.iris-web.app</text>

  <!-- ===================== CALLOUTS ===================== -->
  <!-- 1: Super Admin section (rail) -->
  <circle cx="34" cy="706" r="11" fill="#FBAF42"/><text x="34" y="710" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: Pending organizations (invitations) -->
  <circle cx="120" cy="210" r="11" fill="#FBAF42"/><text x="120" y="214" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: Super Admin card -->
  <circle cx="120" cy="380" r="11" fill="#FBAF42"/><text x="120" y="384" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: Organization card (enter tenant) -->
  <circle cx="472" cy="380" r="11" fill="#FBAF42"/><text x="472" y="384" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: deploying / failed status indicators -->
  <circle cx="372" cy="512" r="11" fill="#FBAF42"/><text x="372" y="516" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>

  <!-- callout legend -->
  <text x="120" y="700" font-size="10.5" fill="#8a9196">1 Super Admin section (rail)  &#183;  2 Pending organizations: invitation cards (name + infrastructure - plan) &#8594; org creation  &#183;  3 Super Admin card (admins only)</text>
  <text x="120" y="718" font-size="10.5" fill="#8a9196">4 Organization card: logo + name + version (v{version}.{subversion}); click enters the tenant subdomain  &#183;  5 Per-card Deploying / Failed deployment status</text>
</svg>
