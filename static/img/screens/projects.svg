    <text x="252" y="211">Name</text>
    <text x="372" y="211">Description</text>
    <text x="640" y="211">DueDate</text>
    <text x="742" y="211">Creator</text>
    <text x="838" y="211">Status</text>
  </g>

  <!-- Row 1 (open) -->
  <g>
    <text x="252" y="248" font-size="11.5" fill="#2b2b2e">CRM Q2</text>
    <text x="372" y="248" font-size="11.5" fill="#2b2b2e">Debiteuren uit AFAS_Prod</text>
    <text x="640" y="248" font-size="11.5" fill="#2b2b2e">2026-07-15</text>
    <text x="742" y="248" font-size="11.5" fill="#2b2b2e">J. de Vries</text>
    <rect x="828" y="236" width="56" height="17" rx="4" fill="#e6f4ea"/><text x="856" y="248" font-size="10" fill="#2f9e44" text-anchor="middle">Open</text>
    <text x="898" y="249" font-size="13" fill="#8a9196">&#8943;</text>
  </g>
  <line x1="234" y1="262" x2="924" y2="262" stroke="#eef3f4"/>

  <!-- Row 2 (open) -->
  <g>
    <text x="252" y="288" font-size="11.5" fill="#2b2b2e">Finance</text>
