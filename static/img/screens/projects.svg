    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161" fill="#8a9196">Admin</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="219" fill="#1c1c1e">Projects</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Sources</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Engineer</text></g>
  </g>

  <!-- sub-sidebar: Projects section links -->
  <rect x="68" y="56" width="150" height="744" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="84" y="84" font-size="11" font-weight="700" fill="#5b6166">PROJECTS</text>
  <!-- active link highlighted -->
  <rect x="74" y="98" width="138" height="26" rx="6" fill="#FEF1DD"/>
  <rect x="74" y="98" width="3" height="26" rx="1.5" fill="#FBAF42"/>
  <text x="90" y="115" font-size="11.5" font-weight="600" fill="#e89a1f">Projects</text>
  <text x="90" y="146" font-size="11.5" fill="#2b2b2e">Changes</text>
  <text x="90" y="174" font-size="11.5" fill="#2b2b2e">Scripted objects</text>
  <text x="90" y="202" font-size="11.5" fill="#2b2b2e">Release change</text>
  <text x="90" y="230" font-size="11.5" fill="#2b2b2e">Install change</text>

  <!-- page title -->
  <text x="234" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Projects</text>
  <text x="234" y="114" font-size="12.5" fill="#8a9196">Bundel werk aan het datawarehouse in projecten met een einddatum</text>

  <!-- MAIN: projects table card -->
  <rect x="234" y="134" width="690" height="500" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- card title row + create button -->
  <text x="252" y="166" font-size="14" font-weight="700" fill="#1c1c1e">Projects</text>
  <rect x="778" y="146" width="130" height="32" rx="6" fill="#FBAF42"/>
  <text x="843" y="166" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">Create project</text>

  <!-- table header band -->
