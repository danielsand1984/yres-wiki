    <text x="640" y="288" font-size="11.5" fill="#2b2b2e">2026-08-01</text>
    <text x="742" y="288" font-size="11.5" fill="#2b2b2e">M. Jansen</text>
    <rect x="828" y="276" width="56" height="17" rx="4" fill="#e6f4ea"/><text x="856" y="288" font-size="10" fill="#2f9e44" text-anchor="middle">Open</text>
    <text x="898" y="289" font-size="13" fill="#8a9196">&#8943;</text>
  </g>
  <line x1="234" y1="302" x2="924" y2="302" stroke="#eef3f4"/>

  <!-- Row 3 (released) -->
  <g>
    <text x="252" y="328" font-size="11.5" fill="#2b2b2e">HR rapportage</text>
    <text x="372" y="328" font-size="11.5" fill="#2b2b2e">Verlofgegevens uit SQL_CRM</text>
    <text x="640" y="328" font-size="11.5" fill="#2b2b2e">2026-06-30</text>
    <text x="742" y="328" font-size="11.5" fill="#2b2b2e">J. de Vries</text>
    <rect x="828" y="316" width="62" height="17" rx="4" fill="#eef6fb"/><text x="859" y="328" font-size="10" fill="#1c6ea4" text-anchor="middle">released</text>
    <text x="898" y="329" font-size="13" fill="#8a9196">&#8943;</text>
  </g>
  <line x1="234" y1="342" x2="924" y2="342" stroke="#eef3f4"/>

  <!-- Row 4 (closed) -->
  <g>
    <text x="252" y="368" font-size="11.5" fill="#2b2b2e">Sales dashboards</text>
    <text x="372" y="368" font-size="11.5" fill="#2b2b2e">Omzet via Expose-schema</text>
    <text x="640" y="368" font-size="11.5" fill="#2b2b2e">2026-05-20</text>
    <text x="742" y="368" font-size="11.5" fill="#2b2b2e">M. Jansen</text>
    <rect x="828" y="356" width="56" height="17" rx="4" fill="#eef3f4"/><text x="856" y="368" font-size="10" fill="#5b6166" text-anchor="middle">Closed</text>
    <text x="898" y="369" font-size="13" fill="#8a9196">&#8943;</text>
  </g>
  <line x1="234" y1="382" x2="924" y2="382" stroke="#eef3f4"/>

  <!-- footer hint inside card -->
  <text x="252" y="414" font-size="10.5" fill="#8a9196">Status-codes: 1 Open &#183; 2 Closed &#183; 3 released &#183; 9 Deleted &#183; 99 Discontinued.</text>

  <!-- single-env warning banner -->
  <rect x="234" y="448" width="690" height="44" rx="8" fill="#fff8ec" stroke="#FBAF42"/>
  <circle cx="262" cy="470" r="10" fill="#fff3e0"/><text x="262" y="474" font-size="12" fill="#f08c00" text-anchor="middle" font-weight="700">!</text>
  <text x="284" y="467" font-size="11.5" font-weight="600" fill="#1c1c1e">Alleen bij meerdere omgevingen</text>
  <text x="284" y="483" font-size="11" fill="#8a9196">De sectie Projects is verborgen voor organisaties met &#233;&#233;n omgeving.</text>

  <!-- ===================== CREATE PROJECT MODAL (right) ===================== -->
  <rect x="944" y="134" width="256" height="320" rx="10" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="944" y="134" width="256" height="42" rx="10" fill="#f6f9f9"/>
  <rect x="944" y="158" width="256" height="18" fill="#f6f9f9"/>
  <text x="964" y="161" font-size="13" font-weight="700" fill="#1c1c1e">Create project</text>
  <!-- Name -->
  <text x="964" y="200" font-size="11" fill="#8a9196">Name</text>
  <rect x="964" y="206" width="216" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="976" y="225" font-size="11.5" fill="#2b2b2e">crm q2</text>
  <text x="1140" y="200" font-size="9.5" fill="#8a9196">max 30</text>
  <!-- Description -->
  <text x="964" y="256" font-size="11" fill="#8a9196">Description</text>
  <rect x="964" y="262" width="216" height="48" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="976" y="281" font-size="11.5" fill="#2b2b2e">Debiteuren uit AFAS_Prod</text>
  <text x="976" y="297" font-size="11.5" fill="#2b2b2e">naar STAGE / HIS / Expose</text>
  <text x="1132" y="256" font-size="9.5" fill="#8a9196">max 400</text>
  <!-- DueDate -->
  <text x="964" y="330" font-size="11" fill="#8a9196">DueDate</text>
  <rect x="964" y="336" width="216" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="976" y="355" font-size="11.5" fill="#2b2b2e">2026-07-15</text>
  <text x="1166" y="355" font-size="11" fill="#8a9196">&#128197;</text>
  <text x="964" y="382" font-size="9.5" fill="#8a9196">Moet in de toekomst liggen.</text>
  <!-- modal buttons -->
  <rect x="964" y="404" width="84" height="28" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1006" y="422" font-size="11" fill="#5b6166" text-anchor="middle">Annuleren</text>
  <rect x="1096" y="404" width="84" height="28" rx="6" fill="#FBAF42"/>
  <text x="1138" y="422" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">Opslaan</text>

  <!-- ===================== CALLOUT MARKERS ===================== -->
  <!-- 1: section sub-links -->
  <circle cx="184" cy="111" r="11" fill="#FBAF42"/><text x="184" y="115" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: create project button -->
  <circle cx="778" cy="146" r="11" fill="#FBAF42"/><text x="778" y="150" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: column headers grid -->
  <circle cx="252" cy="207" r="11" fill="#FBAF42"/><text x="252" y="211" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: status badge -->
  <circle cx="856" cy="244" r="11" fill="#FBAF42"/><text x="856" y="248" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: single-env banner -->
  <circle cx="234" cy="448" r="11" fill="#FBAF42"/><text x="234" y="452" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: create-project modal fields -->
  <circle cx="944" cy="134" r="11" fill="#FBAF42"/><text x="944" y="138" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="11" fill="#2b2b2e">
    <text x="234" y="538" font-size="11.5" font-weight="700" fill="#1c1c1e">Annotaties</text>
    <circle cx="244" cy="556" r="9" fill="#FBAF42"/><text x="244" y="560" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
    <text x="262" y="560">Sub-links van de sectie Projects: Projects, Changes, Scripted objects, Release change, Install change.</text>
    <circle cx="244" cy="580" r="9" fill="#FBAF42"/><text x="244" y="584" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
    <text x="262" y="584">"Create project" &#8212; opent de modal met Name, Description en DueDate.</text>
    <circle cx="244" cy="604" r="9" fill="#FBAF42"/><text x="244" y="608" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
    <text x="262" y="608">Projectentabel (kolommen): Name, Description, DueDate, Creator, Status.</text>
    <circle cx="244" cy="628" r="9" fill="#FBAF42"/><text x="244" y="632" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
    <text x="262" y="632">Status-tekst (1 Open / 2 Closed / 3 released / 9 Deleted / 99 Discontinued).</text>
    <circle cx="700" cy="556" r="9" fill="#FBAF42"/><text x="700" y="560" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
    <text x="718" y="560">Sectie verborgen bij &#233;&#233;n omgeving &#8212; changes zijn dan niet nodig.</text>
    <circle cx="700" cy="580" r="9" fill="#FBAF42"/><text x="700" y="584" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>
    <text x="718" y="584">Create-modal: Name (max 30, uniek), Description (max 400), DueDate (toekomst).</text>
  </g>
</svg>
