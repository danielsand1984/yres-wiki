  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>
  <!-- left icon rail (sections) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="161" fill="#1c1c1e">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
  </g>

  <!-- sub-sidebar (Data sources) -->
  <rect x="68" y="56" width="148" height="744" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="84" y="84" font-size="11" font-weight="700" fill="#8a9196" letter-spacing="0.5">DATA SOURCES</text>
  <rect x="76" y="96" width="132" height="26" rx="6" fill="#FEF1DD"/>
  <text x="88" y="113" font-size="11.5" font-weight="600" fill="#e89a1f">Data sources</text>
  <!-- group combobox -->
  <rect x="76" y="130" width="132" height="24" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="86" y="146" font-size="10" fill="#8a9196">Group: None ▾</text>
  <!-- per-source sub-links -->
  <g font-size="11" fill="#2b2b2e">
    <text x="88" y="178">AFAS_Prod</text>
    <text x="88" y="204">ExactOnline</text>
    <text x="88" y="230">SQL_CRM</text>
  </g>

  <!-- page title -->
  <text x="232" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Data sources</text>
  <text x="232" y="114" font-size="12.5" fill="#8a9196">Configured source systems for Acme B.V. · Productie — connect, test and map types</text>

  <!-- MAIN -->
  <!-- toolbar buttons -->
  <rect x="924" y="132" width="118" height="32" rx="6" fill="#FBAF42"/>
  <text x="983" y="152" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">+ Add source</text>
  <rect x="1052" y="132" width="148" height="32" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1126" y="152" font-size="12.5" font-weight="600" fill="#2b2b2e" text-anchor="middle">Refresh metadata</text>

  <!-- table card -->
  <rect x="232" y="180" width="968" height="378" rx="8" fill="#ffffff" stroke="#e3e8ea"/>

  <!-- table header band -->
  <rect x="232" y="180" width="968" height="34" rx="8" fill="#eef3f4"/>
  <rect x="232" y="206" width="968" height="8" fill="#eef3f4"/>
  <g font-size="11.5" font-weight="600" fill="#5b6166">
    <text x="252" y="202">Name</text>
    <text x="452" y="202">Type</text>
    <text x="632" y="202">Integration runtime</text>
    <text x="852" y="202">Credential expiry</text>
    <text x="1012" y="202">Type mapping</text>
    <text x="1130" y="202">Test</text>
  </g>

  <!-- row 1: AFAS_Prod -->
  <text x="252" y="238" font-size="12" font-weight="600" fill="#1c1c1e">AFAS_Prod</text>
  <text x="452" y="238" font-size="12" fill="#2b2b2e">AFAS</text>
  <text x="632" y="238" font-size="12" fill="#2b2b2e">AutoResolveIntegrationRuntime</text>
  <text x="852" y="238" font-size="12" fill="#2b2b2e">2026-11-30</text>
  <text x="1012" y="238" font-size="12" font-weight="600" fill="#1c7ed6">typemapping</text>
  <circle cx="1133" cy="234" r="9" fill="#FEF1DD"/><path d="M1129 234h8M1133 230v8" stroke="#1c7ed6" stroke-width="1.6"/>
  <line x1="232" y1="252" x2="1200" y2="252" stroke="#eef3f4"/>

  <!-- row 2: ExactOnline (credential warning) -->
  <text x="252" y="276" font-size="12" font-weight="600" fill="#1c1c1e">ExactOnline</text>
  <text x="452" y="276" font-size="12" fill="#2b2b2e">ExactOnline</text>
  <text x="632" y="276" font-size="12" fill="#2b2b2e">SHIR-Acme-01</text>
  <rect x="852" y="265" width="118" height="18" rx="4" fill="#fff3e0"/>
  <text x="860" y="278" font-size="11" font-weight="600" fill="#f08c00">2026-07-08 · soon</text>
  <text x="1012" y="276" font-size="12" font-weight="600" fill="#1c7ed6">typemapping</text>
  <circle cx="1133" cy="272" r="9" fill="#FEF1DD"/><path d="M1129 272h8M1133 268v8" stroke="#1c7ed6" stroke-width="1.6"/>
  <line x1="232" y1="290" x2="1200" y2="290" stroke="#eef3f4"/>

  <!-- row 3: SQL_CRM -->
  <text x="252" y="314" font-size="12" font-weight="600" fill="#1c1c1e">SQL_CRM</text>
  <text x="452" y="314" font-size="12" fill="#2b2b2e">Azure SQL Database</text>
  <text x="632" y="314" font-size="12" fill="#2b2b2e">AutoResolveIntegrationRuntime</text>
  <text x="852" y="314" font-size="12" fill="#2b2b2e">—</text>
  <text x="1012" y="314" font-size="12" font-weight="600" fill="#1c7ed6">typemapping</text>
  <circle cx="1133" cy="310" r="9" fill="#FEF1DD"/><path d="M1129 310h8M1133 306v8" stroke="#1c7ed6" stroke-width="1.6"/>
  <line x1="232" y1="328" x2="1200" y2="328" stroke="#eef3f4"/>

  <!-- row 4: AzureBlobStorage (greyed out: not installed / inactive) -->
  <rect x="232" y="328" width="968" height="32" fill="#f6f9f9"/>
  <text x="252" y="350" font-size="12" font-weight="600" fill="#8a9196">Files_Blob</text>
  <text x="452" y="350" font-size="12" fill="#8a9196">AzureBlobStorage</text>
  <text x="632" y="350" font-size="12" fill="#8a9196">SHIR-Acme-01</text>
  <text x="852" y="350" font-size="12" fill="#8a9196">—</text>
  <text x="1012" y="350" font-size="11.5" fill="#8a9196">not installed</text>
  <line x1="232" y1="360" x2="1200" y2="360" stroke="#eef3f4"/>

  <!-- footer hint inside card: schemas + count -->
  <text x="252" y="392" font-size="11.5" fill="#8a9196">4 sources · loads land in schemas STAGE → HIS → Expose</text>

  <!-- credential-expiry toast (surface, top-right of main) -->
  <rect x="864" y="412" width="320" height="44" rx="8" fill="#fff3e0" stroke="#f08c00"/>
  <circle cx="886" cy="434" r="8" fill="#f08c00"/><text x="886" y="438" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="902" y="430" font-size="11.5" font-weight="600" fill="#1c1c1e">Credentials almost expired for ExactOnline.</text>
  <text x="902" y="446" font-size="11" fill="#8a9196">Consider updating them.</text>

  <!-- callouts -->
  <circle cx="983" cy="148" r="11" fill="#FBAF42"/><text x="983" y="152" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <circle cx="1126" cy="148" r="11" fill="#FBAF42"/><text x="1126" y="152" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <circle cx="290" cy="238" r="11" fill="#FBAF42"/><text x="290" y="242" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <circle cx="1162" cy="234" r="11" fill="#FBAF42"/><text x="1162" y="238" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <circle cx="218" cy="344" r="11" fill="#FBAF42"/><text x="218" y="348" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <circle cx="846" cy="434" r="11" fill="#FBAF42"/><text x="846" y="438" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- callout legend -->
  <g font-size="11.5" fill="#2b2b2e">
    <text x="232" y="500"><tspan font-weight="700" fill="#1c1c1e">1</tspan>  “Add source” opens the multi-step CreateSource modal (Source name, type, integration runtime, credential expiry, tags).</text>
    <text x="232" y="520"><tspan font-weight="700" fill="#1c1c1e">2</tspan>  “Refresh metadata” re-reads source schema/tables for the selected source.</text>
    <text x="232" y="540"><tspan font-weight="700" fill="#1c1c1e">3</tspan>  Sources table — click a row name to open its used-tables / used-files view.</text>
    <text x="700" y="500"><tspan font-weight="700" fill="#1c1c1e">4</tspan>  Blue plug = connectivity test (installed, non-REST sources only).</text>
    <text x="700" y="520"><tspan font-weight="700" fill="#1c1c1e">5</tspan>  Greyed rows are not-installed / inactive sources.</text>
    <text x="700" y="540"><tspan font-weight="700" fill="#1c1c1e">6</tspan>  Expiry toast fires when a credential is past (or within a month of) expiry.</text>
  </g>
</svg>
