  <!-- 6: Role CRUD permissions editor -->
  <circle cx="896" cy="430" r="11" fill="#FBAF42"/><text x="896" y="434" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- callout legend -->
  <text x="244" y="704" font-size="10.5" fill="#8a9196">1 Admin section (rail)  &#183;  2 Users table: name / email / role / sso  &#183;  3 Add user &#8594; Create user modal (email, role, Require SSO Login)</text>
  <text x="244" y="722" font-size="10.5" fill="#8a9196">4 Roles table  &#183;  5 Delete-role confirm dialog  &#183;  6 Maintain role &#8594; multi-step CRUD + Other permissions (Name / CRUD / Other)</text>
