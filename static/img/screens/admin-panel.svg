  <!-- ===================== CALLOUTS ===================== -->
  <!-- 1: Admin rail active -->
  <circle cx="34" cy="388" r="11" fill="#FBAF42"/><text x="34" y="392" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: Users table -->
  <circle cx="264" cy="208" r="11" fill="#FBAF42"/><text x="264" y="212" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: Add user button -->
  <circle cx="722" cy="169" r="11" fill="#FBAF42"/><text x="722" y="173" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: Roles table -->
