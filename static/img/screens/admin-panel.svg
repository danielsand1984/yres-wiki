    <text x="906" y="524">Load management</text>
    <text x="1024" y="524" fill="#2f9e44">&#10003;</text><text x="1064" y="524" fill="#8a9196">&#8211;</text><text x="1104" y="524" fill="#8a9196">&#8211;</text><text x="1144" y="524" fill="#8a9196">&#8211;</text>
    <text x="906" y="548">Users</text>
    <text x="1024" y="548" fill="#2f9e44">&#10003;</text><text x="1064" y="548" fill="#8a9196">&#8211;</text><text x="1104" y="548" fill="#8a9196">&#8211;</text><text x="1144" y="548" fill="#8a9196">&#8211;</text>
    <text x="906" y="572">Roles</text>
    <text x="1024" y="572" fill="#2f9e44">&#10003;</text><text x="1064" y="572" fill="#8a9196">&#8211;</text><text x="1104" y="572" fill="#8a9196">&#8211;</text><text x="1144" y="572" fill="#8a9196">&#8211;</text>
  </g>
