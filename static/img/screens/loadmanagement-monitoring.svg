  <text x="626" y="712" font-size="10.5" font-style="italic" fill="#8a9196">[Monitoring].[LS_Trans] — for FAILED runs the error message + ADF link appear above the grid.</text>

  <!-- ============ CALLOUTS ============ -->
  <!-- 1: targets tree -->
  <circle cx="262" cy="227" r="11" fill="#FBAF42"/><text x="262" y="231" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
