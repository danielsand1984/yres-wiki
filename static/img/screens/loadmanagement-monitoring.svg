    <text x="940" y="572" font-size="10.5" font-weight="600" fill="#2f9e44">SUCCESS</text>
    <text x="1010" y="572" font-size="10.5" fill="#8a9196">Copied OK</text>
    <text x="1132" y="572">1.482.913</text>
    <line x1="606" y1="584" x2="1178" y2="584" stroke="#eef3f4"/>
