    <text x="424" y="360" font-size="10.5" fill="#8a9196">24-06 02:15</text>
    <text x="516" y="360" font-size="10.5" font-weight="700" fill="#2f9e44">SUCCEEDED</text>

    <!-- ExactOnline (source folder) -->
