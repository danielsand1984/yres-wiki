    <text x="244" y="785" font-weight="700" fill="#1c1c1e">1</text><text x="256" y="785">Targets tree: Source / Schema / Table + status rollup</text>
    <text x="640" y="785" font-weight="700" fill="#1c1c1e">2</text><text x="652" y="785">Selected target + Size / Records summary</text>
    <text x="1000" y="785" font-weight="700" fill="#1c1c1e">3</text><text x="1012" y="785">Reset table (confirm)</text>
    <text x="244" y="799" font-weight="700" fill="#1c1c1e">4</text><text x="256" y="799">Runs grid: Status / DateTime / Load type / Runtime / Copied / New / Delta</text>
    <text x="700" y="799" font-weight="700" fill="#1c1c1e">5</text><text x="712" y="799">Info = steps modal, Clock = rollback</text>
    <text x="966" y="799" font-weight="700" fill="#1c1c1e">6</text><text x="978" y="799">Steps: Step / DateTime / Status / Log / Rows</text>
