    <text x="800" y="606" font-size="10.5">02:17:48</text>
    <text x="940" y="606" font-size="10.5" font-weight="600" fill="#2f9e44">SUCCESS</text>
    <text x="1010" y="606" font-size="10.5" fill="#8a9196">SCD2 merge</text>
    <text x="1132" y="606">1.482.913</text>
    <line x1="606" y1="618" x2="1178" y2="618" stroke="#eef3f4"/>
    <text x="626" y="640">Land Parquet → Data Lake</text>
    <text x="800" y="640" font-size="10.5">02:18:09</text>
    <text x="940" y="640" font-size="10.5" font-weight="600" fill="#2f9e44">SUCCESS</text>
    <text x="1010" y="640" font-size="10.5" fill="#8a9196">Expose ready</text>
    <text x="1132" y="640">1.482.913</text>
    <line x1="606" y1="652" x2="1178" y2="652" stroke="#eef3f4"/>
    <text x="626" y="674">spWriteLoadStatus</text>
    <text x="800" y="674" font-size="10.5">02:18:13</text>
    <text x="940" y="674" font-size="10.5" font-weight="600" fill="#2f9e44">SUCCESS</text>
    <text x="1010" y="674" font-size="10.5" fill="#8a9196">Logged</text>
    <text x="1132" y="674">null</text>
