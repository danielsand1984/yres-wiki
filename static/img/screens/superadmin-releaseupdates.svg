<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">SuperAdmin Yres &#183; Release updates</text>
  <!-- superadmin scope: no org/env switcher, no help icon; just user avatar -->
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail (Super Admin section active, y=700) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161" fill="#8a9196">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
    <!-- Super Admin (active) at y=700 -->
    <g><rect x="14" y="686" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="703" font-size="8" fill="#1c1c1e">Super</text><text x="34" y="713" font-size="8" fill="#1c1c1e">Admin</text></g>
  </g>

  <!-- sub-link column (superadmin sub-sidebar), Release updates active (non-prod only) -->
  <rect x="68" y="56" width="150" height="744" fill="#ffffff" stroke="#e3e8ea"/>
  <g font-size="11.5" fill="#5b6166">
    <text x="84" y="92">Admin panel</text>
    <text x="84" y="124">Audit logs</text>
    <text x="84" y="156">Announcements</text>
    <text x="84" y="188">Plans</text>
    <text x="84" y="220">Deployments</text>
    <text x="84" y="252">Invitations</text>
    <text x="84" y="284">Translations</text>
    <text x="84" y="316">Webapp keys</text>
    <!-- active sub-link -->
    <rect x="68" y="332" width="150" height="30" fill="#FEF1DD"/>
    <rect x="68" y="332" width="3" height="30" fill="#FBAF42"/>
    <text x="84" y="352" font-weight="700" fill="#1c1c1e">Release updates</text>
  </g>

  <!-- page title -->
  <text x="244" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Release update</text>
  <text x="244" y="114" font-size="12.5" fill="#8a9196">Release changes made in DWH and ADF git repositories</text>

  <!-- ===================== MAIN ===================== -->

  <!-- centered intro block -->
  <text x="722" y="160" font-size="18" font-weight="700" fill="#1c1c1e" text-anchor="middle">Release update</text>
  <text x="722" y="182" font-size="12" fill="#8a9196" text-anchor="middle">Release changes made in DWH and ADF git repositories</text>
  <text x="722" y="200" font-size="11" fill="#8a9196" text-anchor="middle">Promote each releasable version one stage forward: dev &#8594; test, then test &#8594; prod (versions where web_app_environment &#8800; 'prod', sorted desc).</text>

  <!-- ===== releasable-version cards (2-col grid) ===== -->

  <!-- Card 1: dev -> test -->
  <rect x="290" y="232" width="392" height="150" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="290" y="232" width="392" height="6" rx="3" fill="#1c7ed6"/>
  <rect x="314" y="256" width="118" height="22" rx="4" fill="#e7f0fb"/><text x="373" y="271" font-size="11" font-weight="600" fill="#1c7ed6" text-anchor="middle">dev &#8594; test</text>
  <text x="314" y="312" font-size="16" font-weight="700" fill="#1c1c1e">Release v1.57 from dev to test</text>
  <text x="314" y="338" font-size="11.5" fill="#8a9196">STAGE/HIS load-engine fix for AFAS_Prod delta overlap;</text>
  <text x="314" y="354" font-size="11.5" fill="#8a9196">new Expose view persistence options. Built from DWH + ADF git.</text>
  <text x="660" y="370" font-size="11" font-weight="600" fill="#e89a1f" text-anchor="end">Click to release &#8594;</text>

  <!-- Card 2: test -> prod -->
  <rect x="722" y="232" width="392" height="150" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="722" y="232" width="392" height="6" rx="3" fill="#2f9e44"/>
  <rect x="746" y="256" width="126" height="22" rx="4" fill="#e6f4ea"/><text x="809" y="271" font-size="11" font-weight="600" fill="#2f9e44" text-anchor="middle">test &#8594; prod</text>
  <text x="746" y="312" font-size="16" font-weight="700" fill="#1c1c1e">Release v1.56 from test to prod</text>
  <text x="746" y="338" font-size="11.5" fill="#8a9196">Validated on Acme B.V. / Productie across ExactOnline,</text>
  <text x="746" y="354" font-size="11.5" fill="#8a9196">SQL_CRM, AFAS_Prod. Promotes the prod web-app version.</text>
  <text x="1092" y="370" font-size="11" font-weight="600" fill="#e89a1f" text-anchor="end">Click to release &#8594;</text>

  <!-- Card 3: dev -> test (older) -->
  <rect x="290" y="404" width="392" height="150" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="290" y="404" width="392" height="6" rx="3" fill="#1c7ed6"/>
  <rect x="314" y="428" width="118" height="22" rx="4" fill="#e7f0fb"/><text x="373" y="443" font-size="11" font-weight="600" fill="#1c7ed6" text-anchor="middle">dev &#8594; test</text>
  <text x="314" y="484" font-size="16" font-weight="700" fill="#1c1c1e">Release v1.55 from dev to test</text>
  <text x="314" y="510" font-size="11.5" fill="#8a9196">Shared integration runtimes; firewall rule sync for</text>
  <text x="314" y="526" font-size="11.5" fill="#8a9196">customer Azure tenants. Carried in the ADF repo.</text>
  <text x="660" y="542" font-size="11" font-weight="600" fill="#e89a1f" text-anchor="end">Click to release &#8594;</text>

  <!-- Card 4: test -> prod (older) -->
  <rect x="722" y="404" width="392" height="150" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="722" y="404" width="392" height="6" rx="3" fill="#2f9e44"/>
  <rect x="746" y="428" width="126" height="22" rx="4" fill="#e6f4ea"/><text x="809" y="443" font-size="11" font-weight="600" fill="#2f9e44" text-anchor="middle">test &#8594; prod</text>
  <text x="746" y="484" font-size="16" font-weight="700" fill="#1c1c1e">Release v1.54 from test to prod</text>
  <text x="746" y="510" font-size="11.5" fill="#8a9196">Monitoring rollback + reset-table improvements. No</text>
  <text x="746" y="526" font-size="11.5" fill="#8a9196">breaking schema changes for STAGE/HIS/Expose.</text>
  <text x="1092" y="542" font-size="11" font-weight="600" fill="#e89a1f" text-anchor="end">Click to release &#8594;</text>

  <!-- ===== confirm modal (ContainerModal, opens on card click) ===== -->
  <rect x="0" y="0" width="1240" height="800" fill="#1c1c1e" fill-opacity="0.18"/>
  <rect x="430" y="588" width="380" height="172" rx="10" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="456" y="624" font-size="15" font-weight="700" fill="#1c1c1e">Update</text>
  <line x1="430" y1="638" x2="810" y2="638" stroke="#eef3f4"/>
  <text x="456" y="676" font-size="13" fill="#2b2b2e">Are you sure you want to release the update?</text>
  <text x="456" y="698" font-size="11" fill="#8a9196">POST /admin/update/release/{web_app_environment}</text>
  <!-- modal buttons -->
  <rect x="600" y="718" width="78" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/><text x="639" y="738" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">cancel</text>
  <rect x="690" y="718" width="96" height="30" rx="6" fill="#FBAF42"/><text x="738" y="738" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">yes</text>

  <!-- ===================== CALLOUTS ===================== -->
  <!-- 1: Super Admin section (rail) -->
  <circle cx="34" cy="706" r="11" fill="#FBAF42"/><text x="34" y="710" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: Release updates sub-link (non-prod only) -->
  <circle cx="206" cy="347" r="11" fill="#FBAF42"/><text x="206" y="351" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: dev -> test version card -->
  <circle cx="290" cy="232" r="11" fill="#FBAF42"/><text x="290" y="236" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: test -> prod version card -->
  <circle cx="722" cy="232" r="11" fill="#FBAF42"/><text x="722" y="236" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: version description line -->
  <circle cx="314" cy="338" r="11" fill="#FBAF42"/><text x="314" y="342" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: release confirm modal -->
  <circle cx="430" cy="606" r="11" fill="#FBAF42"/><text x="430" y="610" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- callout legend -->
  <text x="244" y="724" font-size="10.5" fill="#8a9196">1 Super Admin section (rail)  &#183;  2 Release updates sub-link (hidden in production / iris-web.app)  &#183;  3 dev &#8594; test card: "Release v{X}.{Y+1} from dev to test"</text>
  <text x="244" y="742" font-size="10.5" fill="#8a9196">4 test &#8594; prod card: "Release v{X}.{Y} from test to prod"  &#183;  5 Version description  &#183;  6 Confirm modal "Update" &#8594; yes &#8594; POST /admin/update/release/{env}</text>
</svg>
