<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- page bg -->
  <rect width="1240" height="800" fill="#ffffff"/>

  <!-- minimal top bar (auth: user not yet set, no breadcrumb / env switcher / rail) -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/>
  <path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/>
  <rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Sign in</text>

  <!-- title + subtitle -->
  <text x="92" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Login</text>
  <text x="92" y="114" font-size="12.5" fill="#8a9196">Auth screen · /login · centered card, no left rail (front scope, unauthenticated)</text>

  <!-- ===== CENTERED AUTH CARD (rail "none" -> drop rail, center a card) ===== -->

  <!-- Yres logo above the card -->
  <g>
    <rect x="582" y="208" width="76" height="76" rx="14" fill="#FEF1DD" stroke="#e3e8ea"/>
    <circle cx="620" cy="240" r="20" fill="#FBAF42"/>
    <path d="M609 231l11 13 11-13h-7l-4 4.5-4-4.5z" fill="#1c1c1e"/>
    <rect x="616.5" y="244" width="7.5" height="13" rx="3" fill="#1c1c1e"/>
    <text x="620" y="276" font-size="11" font-weight="700" fill="#e89a1f" text-anchor="middle">Yres</text>
  </g>

  <!-- card -->
  <rect x="470" y="300" width="300" height="372" rx="8" fill="#ffffff" stroke="#e3e8ea"/>

  <!-- card title -->
  <text x="620" y="338" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="middle">Sign in</text>
  <line x1="494" y1="356" x2="746" y2="356" stroke="#e3e8ea"/>

  <!-- inline server-error banner area (error fallback "Onjuiste inloggegevens") -->
  <rect x="494" y="372" width="252" height="34" rx="6" fill="#fde8e8" stroke="#e03131" stroke-opacity="0.35"/>
  <circle cx="510" cy="389" r="6" fill="#e03131"/>
  <text x="510" y="393" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="524" y="393" font-size="11" fill="#e03131">Onjuiste inloggegevens</text>

  <!-- email field -->
  <text x="494" y="428" font-size="11" fill="#8a9196">email</text>
  <rect x="494" y="434" width="252" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="506" y="455" font-size="12" fill="#2b2b2e">jan.devries@acme.nl</text>

  <!-- password field -->
  <text x="494" y="490" font-size="11" fill="#8a9196">password</text>
  <rect x="494" y="496" width="252" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="506" y="517" font-size="13" letter-spacing="2" fill="#2b2b2e">............</text>
  <circle cx="732" cy="513" r="6" fill="none" stroke="#8a9196"/>
  <circle cx="732" cy="513" r="2" fill="#8a9196"/>

  <!-- primary submit: "Sign in" -->
  <rect x="494" y="546" width="252" height="38" rx="6" fill="#FBAF42"/>
  <text x="620" y="570" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Sign in</text>

  <!-- OR divider + Azure SSO (shown when auth methods include 'azure') -->
  <line x1="494" y1="600" x2="588" y2="600" stroke="#e3e8ea"/>
  <text x="620" y="604" font-size="11" font-weight="600" fill="#8a9196" text-anchor="middle">OR</text>
  <line x1="652" y1="600" x2="746" y2="600" stroke="#e3e8ea"/>
  <rect x="494" y="616" width="252" height="34" rx="6" fill="#ffffff" stroke="#FBAF42"/>
  <rect x="556" y="626" width="12" height="12" fill="#e89a1f"/>
  <line x1="562" y1="626" x2="562" y2="638" stroke="#ffffff"/>
  <line x1="556" y1="632" x2="568" y2="632" stroke="#ffffff"/>
  <text x="576" y="637" font-size="12" font-weight="600" fill="#e89a1f">Login with Azure</text>

  <!-- forgot-password bottom link -->
  <text x="620" y="668" font-size="11.5" fill="#1c7ed6" text-anchor="middle" text-decoration="underline">Forgot password?</text>

  <!-- "Powered by Yres" badge (bottom-right of viewport) -->
  <rect x="1058" y="744" width="182" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1074" y="777" font-size="12" font-weight="600" fill="#8a9196">Powered by</text>
  <circle cx="1188" cy="772" r="11" fill="#FBAF42"/>
  <path d="M1182 767l6 7 6-7h-4l-2 2.5-2-2.5z" fill="#1c1c1e"/>
  <rect x="1185.5" y="774" width="4.5" height="7" rx="2" fill="#1c1c1e"/>
  <text x="1208" y="777" font-size="12" font-weight="700" fill="#1c1c1e">Yres</text>

  <!-- ===== NUMBERED ORANGE CALLOUT MARKERS ===== -->
  <!-- 1: logo / themed background -->
  <circle cx="664" cy="214" r="11" fill="#FBAF42"/>
  <text x="664" y="218" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: email field -->
  <circle cx="762" cy="451" r="11" fill="#FBAF42"/>
  <text x="762" y="455" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: password field -->
  <circle cx="762" cy="513" r="11" fill="#FBAF42"/>
  <text x="762" y="517" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: Sign in submit -->
  <circle cx="762" cy="565" r="11" fill="#FBAF42"/>
  <text x="762" y="569" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: Forgot password link -->
  <circle cx="762" cy="664" r="11" fill="#FBAF42"/>
  <text x="762" y="668" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: inline server-error banner -->
  <circle cx="458" cy="389" r="11" fill="#FBAF42"/>
  <text x="458" y="393" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ===== CALLOUT LEGEND ===== -->
  <rect x="92" y="160" width="330" height="200" rx="8" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="110" y="184" font-size="13" font-weight="700" fill="#1c1c1e">Callouts</text>
  <g font-size="11.5" fill="#2b2b2e">
    <circle cx="116" cy="206" r="9" fill="#FBAF42"/><text x="116" y="210" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
    <text x="134" y="210">Yres logo / themed background (org theme)</text>
    <circle cx="116" cy="232" r="9" fill="#FBAF42"/><text x="116" y="236" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
    <text x="134" y="236">Email field (required, valid email — Yup)</text>
    <circle cx="116" cy="258" r="9" fill="#FBAF42"/><text x="116" y="262" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
    <text x="134" y="262">Password field (required, type=password)</text>
    <circle cx="116" cy="284" r="9" fill="#FBAF42"/><text x="116" y="288" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
    <text x="134" y="288">"Sign in" → POST /api/v1/login, then /</text>
    <circle cx="116" cy="310" r="9" fill="#FBAF42"/><text x="116" y="314" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
    <text x="134" y="314">"Forgot password?" → /forgot-password</text>
    <circle cx="116" cy="336" r="9" fill="#FBAF42"/><text x="116" y="340" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>
    <text x="134" y="340">Server-error banner ("Onjuiste inloggegevens")</text>
  </g>
</svg>
