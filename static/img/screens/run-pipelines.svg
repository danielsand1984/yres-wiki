<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Load management / Run pipelines</text>
  <!-- env switcher (top-right) -->
  <rect x="940" y="14" width="170" height="28" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="954" y="32" font-size="12" fill="#2b2b2e">Acme B.V. · Productie ▾</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail (sections) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161" fill="#8a9196">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="219" fill="#1c1c1e">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
  </g>

  <!-- sub-link sidebar (Load management) -->
  <rect x="68" y="56" width="150" height="744" fill="#ffffff" stroke="#e3e8ea"/>
  <g font-size="11.5" fill="#5b6166">
    <text x="84" y="86" font-size="10" font-weight="700" fill="#8a9196" letter-spacing="0.5">LOAD MANAGEMENT</text>
    <rect x="74" y="100" width="138" height="26" rx="6" fill="#FEF1DD"/>
    <text x="84" y="118" font-weight="600" fill="#e89a1f">Run pipelines</text>
    <text x="84" y="146">Design master pipeline</text>
    <text x="84" y="172">Triggers</text>
    <text x="84" y="198">Integration runtimes</text>
    <text x="84" y="234" font-size="10" font-weight="700" fill="#8a9196" letter-spacing="0.5">DATABASE MONITORING</text>
    <text x="84" y="260">Monitoring</text>
    <text x="84" y="286">DWH processes</text>
    <text x="84" y="312">DWH queries</text>
  </g>

  <!-- page title -->
  <text x="244" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Run pipelines</text>
  <text x="244" y="114" font-size="12.5" fill="#8a9196">Browse Data Factory pipelines, filter their runs, and start or stop a run</text>

  <!-- ============ MAIN ============ -->

  <!-- LEFT: PipelineList accordion (col-span-1) -->
  <rect x="244" y="140" width="250" height="620" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="244" y="140" width="250" height="38" rx="8" fill="#eef3f4"/>
  <rect x="244" y="168" width="250" height="10" fill="#eef3f4"/>
  <text x="262" y="164" font-size="12.5" font-weight="600" fill="#5b6166">Select pipeline</text>

  <!-- accordion: root-level pipeline (selected) -->
  <g font-size="12">
    <rect x="252" y="190" width="234" height="34" rx="6" fill="#FEF1DD" stroke="#FBAF42"/>
    <text x="266" y="211" font-weight="600" fill="#1c1c1e">Dynamic Workflow YRES</text>
  </g>

  <!-- accordion folder: Acme Productie -->
  <text x="266" y="252" font-size="11" font-weight="700" fill="#5b6166">▾ Acme Productie</text>
  <g font-size="12" fill="#2b2b2e">
    <text x="278" y="282">Master - Acme Productie</text>
    <text x="278" y="312">Persist Expose Views</text>
  </g>

  <!-- accordion folder: Metadata -->
  <text x="266" y="346" font-size="11" font-weight="700" fill="#5b6166">▾ Metadata</text>
  <g font-size="12" fill="#2b2b2e">
    <text x="278" y="376">GetMetaData - AFAS_Prod</text>
    <text x="278" y="406">GetMetaData - ExactOnline</text>
    <text x="278" y="436">GetMetaData - SQL_CRM</text>
  </g>

  <!-- accordion folder: Dynamic -->
  <text x="266" y="470" font-size="11" font-weight="700" fill="#5b6166">▾ Dynamic</text>
  <g font-size="12" fill="#2b2b2e">
    <text x="278" y="500">Dynamic Pipeline YRES - SQL_CRM</text>
    <text x="278" y="530">Materialize View</text>
  </g>
  <line x1="252" y1="262" x2="486" y2="262" stroke="#eef3f4"/>
  <line x1="252" y1="356" x2="486" y2="356" stroke="#eef3f4"/>
  <line x1="252" y1="480" x2="486" y2="480" stroke="#eef3f4"/>

  <!-- RIGHT: filters + runs panel (col-span-3) -->

  <!-- filters row -->
  <!-- runEnd date range -->
  <text x="518" y="156" font-size="11" fill="#8a9196">runEnd</text>
  <rect x="518" y="162" width="208" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="532" y="184" font-size="11.5" fill="#2b2b2e">01 Jun 2026 – 24 Jun 2026</text>
  <rect x="700" y="171" width="12" height="12" rx="1" fill="none" stroke="#8a9196" stroke-width="1.2"/><line x1="700" y1="175" x2="712" y2="175" stroke="#8a9196" stroke-width="1.2"/>

  <!-- status combobox -->
  <text x="742" y="156" font-size="11" fill="#8a9196">status</text>
  <rect x="742" y="162" width="150" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="756" y="184" font-size="11.5" fill="#2b2b2e">Succeeded ▾</text>

  <!-- dynamic-workflow cascade: Source / Schema / Table -->
  <text x="908" y="156" font-size="11" fill="#8a9196">Source</text>
  <rect x="908" y="162" width="92" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="920" y="184" font-size="11.5" fill="#2b2b2e">AFAS_Prod ▾</text>
  <text x="1008" y="156" font-size="11" fill="#8a9196">Schema</text>
  <rect x="1008" y="162" width="88" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1020" y="184" font-size="11.5" fill="#2b2b2e">STAGE ▾</text>
  <text x="1104" y="156" font-size="11" fill="#8a9196">Table</text>
  <rect x="1104" y="162" width="96" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1116" y="184" font-size="11.5" fill="#2b2b2e">No filter ▾</text>

  <!-- runs table card -->
  <rect x="518" y="212" width="682" height="500" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- table title + Start pipeline button -->
  <text x="538" y="242" font-size="13.5" font-weight="700" fill="#1c1c1e">Runs: Dynamic Workflow YRES</text>
  <rect x="1052" y="224" width="130" height="30" rx="6" fill="#FBAF42"/>
  <path d="M1066 232l10 7-10 7z" fill="#1c1c1e"/>
  <text x="1126" y="244" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Start pipeline</text>

  <!-- table header band -->
  <rect x="518" y="268" width="682" height="34" fill="#eef3f4"/>
  <g font-size="11.5" font-weight="600" fill="#5b6166">
    <text x="538" y="289">Source</text>
    <text x="618" y="289">Schema</text>
    <text x="690" y="289">Table</text>
    <text x="800" y="289">status</text>
    <text x="888" y="289">runStart</text>
    <text x="984" y="289">runEnd</text>
    <text x="1080" y="289">runtime</text>
    <text x="1182" y="289" text-anchor="end">Actions</text>
  </g>

  <!-- rows -->
  <g font-size="11.5" fill="#2b2b2e">
    <!-- row 1: succeeded -->
    <text x="538" y="324">AFAS_Prod</text>
    <text x="618" y="324">STAGE</text>
    <text x="690" y="324">Debiteuren</text>
    <rect x="800" y="312" width="74" height="18" rx="4" fill="#e6f4ea"/><text x="808" y="325" font-size="10.5" fill="#2f9e44">Succeeded</text>
    <text x="888" y="324">24 Jun 02:00</text>
    <text x="984" y="324">24 Jun 02:04</text>
    <text x="1080" y="324">4m 12s</text>
    <!-- action: ADF link -->
    <path d="M1166 318a4 4 0 0 1 5 0l2 2a4 4 0 0 1 0 5l-2 2M1172 326a4 4 0 0 1-5 0l-2-2a4 4 0 0 1 0-5l2-2" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="518" y1="338" x2="1200" y2="338" stroke="#eef3f4"/>

    <!-- row 2: succeeded -->
    <text x="538" y="360">AFAS_Prod</text>
    <text x="618" y="360">HIS</text>
    <text x="690" y="360">Crediteuren</text>
    <rect x="800" y="348" width="74" height="18" rx="4" fill="#e6f4ea"/><text x="808" y="361" font-size="10.5" fill="#2f9e44">Succeeded</text>
    <text x="888" y="360">24 Jun 02:05</text>
    <text x="984" y="360">24 Jun 02:11</text>
    <text x="1080" y="360">6m 03s</text>
    <path d="M1166 354a4 4 0 0 1 5 0l2 2a4 4 0 0 1 0 5l-2 2M1172 362a4 4 0 0 1-5 0l-2-2a4 4 0 0 1 0-5l2-2" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="518" y1="374" x2="1200" y2="374" stroke="#eef3f4"/>

    <!-- row 3: in progress (stop action) -->
    <text x="538" y="396">ExactOnline</text>
    <text x="618" y="396">STAGE</text>
    <text x="690" y="396">Grootboek</text>
    <rect x="800" y="384" width="74" height="18" rx="4" fill="#fff3e0"/><text x="808" y="397" font-size="10.5" fill="#f08c00">InProgress</text>
    <text x="888" y="396">24 Jun 06:30</text>
    <text x="984" y="396">—</text>
    <text x="1080" y="396">1m 48s</text>
    <!-- action: stop (red) + ADF link -->
    <circle cx="1140" cy="392" r="7" fill="none" stroke="#e03131" stroke-width="1.5"/><rect x="1137" y="389" width="6" height="6" rx="1" fill="#e03131"/>
    <path d="M1166 386a4 4 0 0 1 5 0l2 2a4 4 0 0 1 0 5l-2 2M1172 394a4 4 0 0 1-5 0l-2-2a4 4 0 0 1 0-5l2-2" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="518" y1="410" x2="1200" y2="410" stroke="#eef3f4"/>

    <!-- row 4: failed (view error) -->
    <text x="538" y="432">SQL_CRM</text>
    <text x="618" y="432">STAGE</text>
    <text x="690" y="432">Contacts</text>
    <rect x="800" y="420" width="54" height="18" rx="4" fill="#fde8e8"/><text x="808" y="433" font-size="10.5" fill="#e03131">Failed</text>
    <text x="888" y="432">24 Jun 02:12</text>
    <text x="984" y="432">24 Jun 02:13</text>
    <text x="1080" y="432">38s</text>
    <!-- action: view error (red info) + ADF link -->
    <circle cx="1140" cy="428" r="7" fill="none" stroke="#e03131" stroke-width="1.5"/><text x="1140" y="432" font-size="10" font-weight="700" fill="#e03131" text-anchor="middle">i</text>
    <path d="M1166 422a4 4 0 0 1 5 0l2 2a4 4 0 0 1 0 5l-2 2M1172 430a4 4 0 0 1-5 0l-2-2a4 4 0 0 1 0-5l2-2" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="518" y1="446" x2="1200" y2="446" stroke="#eef3f4"/>

    <!-- row 5: succeeded -->
    <text x="538" y="468">SQL_CRM</text>
    <text x="618" y="468">HIS</text>
    <text x="690" y="468">Orders</text>
    <rect x="800" y="456" width="74" height="18" rx="4" fill="#e6f4ea"/><text x="808" y="469" font-size="10.5" fill="#2f9e44">Succeeded</text>
    <text x="888" y="468">23 Jun 23:00</text>
    <text x="984" y="468">23 Jun 23:09</text>
    <text x="1080" y="468">9m 21s</text>
    <path d="M1166 462a4 4 0 0 1 5 0l2 2a4 4 0 0 1 0 5l-2 2M1172 470a4 4 0 0 1-5 0l-2-2a4 4 0 0 1 0-5l2-2" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="518" y1="482" x2="1200" y2="482" stroke="#eef3f4"/>

    <!-- row 6: cancelled -->
    <text x="538" y="504">ExactOnline</text>
    <text x="618" y="504">Expose</text>
    <text x="690" y="504">vwRevenue</text>
    <rect x="800" y="492" width="68" height="18" rx="4" fill="#fff3e0"/><text x="808" y="505" font-size="10.5" fill="#f08c00">Cancelled</text>
    <text x="888" y="504">23 Jun 18:42</text>
    <text x="984" y="504">23 Jun 18:43</text>
    <text x="1080" y="504">52s</text>
    <path d="M1166 498a4 4 0 0 1 5 0l2 2a4 4 0 0 1 0 5l-2 2M1172 506a4 4 0 0 1-5 0l-2-2a4 4 0 0 1 0-5l2-2" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
    <line x1="518" y1="518" x2="1200" y2="518" stroke="#eef3f4"/>

    <!-- row 7: succeeded -->
    <text x="538" y="540">AFAS_Prod</text>
    <text x="618" y="540">STAGE</text>
    <text x="690" y="540">Kostenplaats</text>
    <rect x="800" y="528" width="74" height="18" rx="4" fill="#e6f4ea"/><text x="808" y="541" font-size="10.5" fill="#2f9e44">Succeeded</text>
    <text x="888" y="540">23 Jun 02:01</text>
    <text x="984" y="540">23 Jun 02:03</text>
    <text x="1080" y="540">2m 07s</text>
    <path d="M1166 534a4 4 0 0 1 5 0l2 2a4 4 0 0 1 0 5l-2 2M1172 542a4 4 0 0 1-5 0l-2-2a4 4 0 0 1 0-5l2-2" stroke="#1c7ed6" stroke-width="1.4" fill="none"/>
  </g>

  <!-- error modal preview (info banner, bottom-right) -->
  <rect x="744" y="660" width="438" height="40" rx="8" fill="#fde8e8" stroke="#e03131" stroke-opacity="0.4"/>
  <circle cx="766" cy="680" r="8" fill="none" stroke="#e03131" stroke-width="1.5"/><text x="766" y="684" font-size="11" font-weight="700" fill="#e03131" text-anchor="middle">!</text>
  <text x="784" y="677" font-size="10.5" font-weight="700" fill="#1c1c1e">Error message</text>
  <text x="784" y="691" font-size="10" fill="#e03131">Login failed for user 'crm_reader' — connection timeout to SQL_CRM</text>

  <!-- ============ CALLOUTS ============ -->
  <!-- 1: pipeline list selection -->
  <circle cx="476" cy="207" r="11" fill="#FBAF42"/><text x="476" y="211" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: runEnd date filter -->
  <circle cx="518" cy="179" r="11" fill="#FBAF42"/><text x="518" y="183" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: status + Source/Schema/Table cascade -->
  <circle cx="908" cy="179" r="11" fill="#FBAF42"/><text x="908" y="183" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: runtime column -->
  <circle cx="1080" cy="289" r="11" fill="#FBAF42"/><text x="1080" y="293" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: per-run actions (stop / view-error / link) -->
  <circle cx="1140" cy="392" r="11" fill="#FBAF42"/><text x="1140" y="396" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: Start pipeline button -->
  <circle cx="1046" cy="239" r="11" fill="#FBAF42"/><text x="1046" y="243" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- callout legend -->
  <g font-size="10.5" fill="#5b6166">
    <text x="244" y="785" font-weight="700" fill="#1c1c1e">1</text><text x="256" y="785">Select a pipeline (folder accordion)</text>
    <text x="500" y="785" font-weight="700" fill="#1c1c1e">2</text><text x="512" y="785">runEnd date-range filter</text>
    <text x="700" y="785" font-weight="700" fill="#1c1c1e">3</text><text x="712" y="785">status + Source / Schema / Table cascade</text>
    <text x="244" y="799" font-weight="700" fill="#1c1c1e">4</text><text x="256" y="799">runtime (Xh Ym Zs)</text>
    <text x="440" y="799" font-weight="700" fill="#1c1c1e">5</text><text x="452" y="799">Stop ■ / view-error i / ADF link</text>
    <text x="700" y="799" font-weight="700" fill="#1c1c1e">6</text><text x="712" y="799">Start pipeline (or "Set parameters to start")</text>
  </g>
</svg>
