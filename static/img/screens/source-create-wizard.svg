<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Data sources &#8250; Add source</text>
  <!-- env switcher (top-right) -->
  <rect x="940" y="14" width="170" height="28" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="954" y="32" font-size="12" fill="#2b2b2e">Acme B.V. &#183; Productie &#9662;</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail (sections) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="161" fill="#1c1c1e">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
  </g>

  <!-- page title -->
  <text x="92" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Add source</text>
  <text x="92" y="114" font-size="12.5" fill="#8a9196">Step 1 of 2 &#8212; general details. Step 2 collects per-environment credentials.</text>

  <!-- ===== dimmed Sources list behind the modal (context) ===== -->
  <g opacity="0.5">
    <!-- sub-sidebar (Data sources) -->
    <rect x="68" y="56" width="150" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
    <text x="84" y="150" font-size="11.5" font-weight="700" fill="#5b6166">DATA SOURCES</text>
    <text x="84" y="178" font-size="11.5" fill="#1c7ed6">All sources</text>
    <text x="84" y="204" font-size="11.5" fill="#2b2b2e">AFAS_Prod</text>
    <text x="84" y="228" font-size="11.5" fill="#2b2b2e">ExactOnline</text>
    <text x="84" y="252" font-size="11.5" fill="#2b2b2e">SQL_CRM</text>
    <!-- sources table -->
    <rect x="238" y="150" width="962" height="34" fill="#eef3f4"/>
    <text x="252" y="171" font-size="11.5" font-weight="600" fill="#5b6166">type</text>
    <text x="430" y="171" font-size="11.5" font-weight="600" fill="#5b6166">name</text>
    <text x="700" y="171" font-size="11.5" font-weight="600" fill="#5b6166">credentials_expiry</text>
    <text x="980" y="171" font-size="11.5" font-weight="600" fill="#5b6166">tags</text>
    <g font-size="11.5" fill="#2b2b2e">
      <text x="252" y="207">AFAS</text><text x="430" y="207">AFAS_Prod</text><text x="700" y="207">2026-09-30</text><text x="980" y="207">finance</text>
      <text x="252" y="239">ExactOnline</text><text x="430" y="239">ExactOnline</text><text x="700" y="239">2026-07-15</text><text x="980" y="239">finance</text>
      <text x="252" y="271">MSSQL</text><text x="430" y="271">SQL_CRM</text><text x="700" y="271">&#8212;</text><text x="980" y="271">crm, sales</text>
    </g>
  </g>
  <!-- scrim -->
  <rect x="68" y="56" width="1172" height="744" fill="#1c1c1e" opacity="0.18"/>

  <!-- ===== WIZARD MODAL ===== -->
  <rect x="372" y="118" width="560" height="600" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- modal header -->
  <text x="396" y="150" font-size="16" font-weight="700" fill="#1c1c1e">Add source</text>
  <text x="908" y="150" font-size="16" fill="#8a9196" text-anchor="middle">&#10005;</text>
  <line x1="372" y1="166" x2="932" y2="166" stroke="#e3e8ea"/>

  <!-- stepper -->
  <line x1="436" y1="200" x2="676" y2="200" stroke="#e3e8ea" stroke-width="2"/>
  <circle cx="436" cy="200" r="13" fill="#FBAF42"/>
  <text x="436" y="205" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <text x="436" y="234" font-size="11" font-weight="600" fill="#1c1c1e" text-anchor="middle">Details</text>
  <circle cx="676" cy="200" r="13" fill="#ffffff" stroke="#8a9196" stroke-width="1.5"/>
  <text x="676" y="205" font-size="13" font-weight="700" fill="#8a9196" text-anchor="middle">2</text>
  <text x="676" y="234" font-size="11" fill="#8a9196" text-anchor="middle">Credentials</text>

  <!-- ===== FORM 1 FIELDS (real labels) ===== -->
  <!-- Source name -->
  <text x="396" y="266" font-size="11" fill="#8a9196">Source name</text>
  <rect x="396" y="272" width="512" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="410" y="294" font-size="12.5" fill="#1c1c1e">SQL_CRM</text>

  <!-- type -->
  <text x="396" y="328" font-size="11" fill="#8a9196">type</text>
  <rect x="396" y="334" width="512" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="410" y="356" font-size="12.5" fill="#1c1c1e">SQL Server</text>
  <text x="894" y="356" font-size="12.5" fill="#8a9196" text-anchor="middle">&#9662;</text>

  <!-- integration runtime -->
  <text x="396" y="390" font-size="11" fill="#8a9196">integration runtime</text>
  <rect x="396" y="396" width="512" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="410" y="418" font-size="12.5" fill="#1c1c1e">AutoResolveIntegrationRuntime</text>
  <text x="894" y="418" font-size="12.5" fill="#8a9196" text-anchor="middle">&#9662;</text>

  <!-- Credentials identical for all environments? -->
  <text x="396" y="452" font-size="11" fill="#8a9196">Credentials identical for all environments?</text>
  <rect x="396" y="458" width="248" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="410" y="480" font-size="12.5" fill="#1c1c1e">Yes</text>
  <text x="630" y="480" font-size="12.5" fill="#8a9196" text-anchor="middle">&#9662;</text>

  <!-- credentials expire? -->
  <text x="660" y="452" font-size="11" fill="#8a9196">credentials expire?</text>
  <rect x="660" y="458" width="248" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="674" y="480" font-size="12.5" fill="#8a9196">dd-mm-yyyy</text>
  <text x="894" y="480" font-size="12.5" fill="#8a9196" text-anchor="middle">&#128197;</text>

  <!-- Tags -->
  <text x="396" y="514" font-size="11" fill="#8a9196">Tags (multiple tags can be separated with commas, e.g. "crm, sales")</text>
  <rect x="396" y="520" width="512" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="410" y="528" width="46" height="18" rx="4" fill="#FEF1DD"/><text x="433" y="541" font-size="10.5" fill="#e89a1f" text-anchor="middle">crm</text>
  <rect x="462" y="528" width="50" height="18" rx="4" fill="#FEF1DD"/><text x="487" y="541" font-size="10.5" fill="#e89a1f" text-anchor="middle">sales</text>
  <text x="520" y="541" font-size="12.5" fill="#8a9196">|</text>

  <!-- helper note -->
  <text x="396" y="582" font-size="11" fill="#8a9196">Next step asks for host, database name, port, user name and password.</text>

  <!-- modal footer buttons -->
  <line x1="372" y1="664" x2="932" y2="664" stroke="#e3e8ea"/>
  <rect x="700" y="676" width="92" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="746" y="698" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Cancel</text>
  <rect x="804" y="676" width="104" height="34" rx="6" fill="#FBAF42"/>
  <text x="856" y="698" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Next &#8594;</text>

  <!-- ===== CALLOUTS ===== -->
  <!-- 1: stepper -->
  <circle cx="556" cy="186" r="11" fill="#FBAF42"/><text x="556" y="190" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: type select -->
  <circle cx="930" cy="351" r="11" fill="#FBAF42"/><text x="930" y="355" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: integration runtime -->
  <circle cx="930" cy="413" r="11" fill="#FBAF42"/><text x="930" y="417" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: credentials identical -->
  <circle cx="396" cy="475" r="11" fill="#FBAF42"/><text x="396" y="479" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: tags -->
  <circle cx="930" cy="537" r="11" fill="#FBAF42"/><text x="930" y="541" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: Next button -->
  <circle cx="932" cy="676" r="11" fill="#FBAF42"/><text x="932" y="680" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ===== legend ===== -->
  <text x="92" y="746" font-size="11.5" font-weight="700" fill="#1c1c1e">Callouts</text>
  <g font-size="11" fill="#2b2b2e">
    <text x="92" y="766">1  Wizard stepper: Details &#8594; Credentials (per-env on step 2 when "identical" is No).</text>
    <text x="92" y="784">2  type picker selects the source connector (SQL Server, AFAS, ExactOnline, OData&#8230;).</text>
    <text x="660" y="766">3  integration runtime: AutoResolveIntegrationRuntime or a published IR.</text>
    <text x="660" y="784">4 identical-creds Yes/No &#183; 5 Tags &#183; 6 Next advances to credentials.</text>
  </g>
</svg>
