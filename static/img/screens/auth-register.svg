<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>

  <!-- top bar (minimal: unauthenticated user, no env switcher / avatar) -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Register &#183; invitation</text>

  <!-- page title (centered auth context: no left rail) -->
  <text x="620" y="104" font-size="20" font-weight="700" fill="#1c1c1e" text-anchor="middle">Create your account</text>
  <text x="620" y="126" font-size="12.5" fill="#8a9196" text-anchor="middle">Invitation-bound registration &#183; /register?invitation=&#8230;&amp;token=&#8230;</text>

  <!-- ===================== MAIN: centered card ===================== -->
  <!-- card -->
  <rect x="400" y="156" width="440" height="540" rx="8" fill="#ffffff" stroke="#e3e8ea"/>

  <!-- heading inside card -->
  <text x="620" y="200" font-size="22" font-weight="700" fill="#1c1c1e" text-anchor="middle">Register</text>

  <!-- multi-step progress header (CustomMultiStepForm: only step 0 "Account" is shown) -->
  <line x1="436" y1="244" x2="804" y2="244" stroke="#e3e8ea" stroke-width="2"/>
  <circle cx="620" cy="244" r="13" fill="#FBAF42"/>
  <text x="620" y="248" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <text x="620" y="276" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="middle">Account</text>
  <text x="620" y="294" font-size="11.5" fill="#8a9196" text-anchor="middle">Provide your name and email address</text>

  <!-- invitation / license note banner -->
  <rect x="436" y="314" width="368" height="56" rx="6" fill="#FEF1DD" stroke="#FBAF42"/>
  <circle cx="458" cy="334" r="8" fill="#FBAF42"/><text x="458" y="338" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">i</text>
  <text x="476" y="332" font-size="11.5" font-weight="600" fill="#1c1c1e">Invited to Acme B.V. &#183; managed &#183; Productie plan</text>
  <text x="476" y="350" font-size="10.5" fill="#8a9196">Invitation valid until 2026-07-08. Email is locked to the invite.</text>

  <!-- field: E-mail (readOnly, prefilled from invitation) -->
  <text x="436" y="402" font-size="11" fill="#8a9196">E-mail</text>
  <rect x="436" y="410" width="368" height="34" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="450" y="431" font-size="12.5" fill="#2b2b2e">jane.doe@acme.nl</text>
  <rect x="742" y="418" width="50" height="18" rx="4" fill="#eef3f4"/>
  <text x="767" y="431" font-size="9.5" fill="#8a9196" text-anchor="middle">locked</text>

  <!-- field: Name -->
  <text x="436" y="470" font-size="11" fill="#8a9196">Name</text>
  <rect x="436" y="478" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="450" y="499" font-size="12.5" fill="#8a9196">Jane Doe</text>

  <!-- field: Password -->
  <text x="436" y="538" font-size="11" fill="#8a9196">Password</text>
  <rect x="436" y="546" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="450" y="567" font-size="12.5" fill="#8a9196">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
  <circle cx="786" cy="563" r="9" fill="#f6f9f9" stroke="#e3e8ea"/><path d="M781 563c2-3 8-3 10 0-2 3-8 3-10 0z" fill="none" stroke="#8a9196" stroke-width="1.1"/><circle cx="786" cy="563" r="1.6" fill="#8a9196"/>

  <!-- password rules hint (from Yup schema) -->
  <text x="436" y="600" font-size="10.5" fill="#8a9196">Min 12 chars &#183; upper + lower &#183; a number &#183; a special character</text>

  <!-- submit button (CustomMultiStepForm advances to org creation) -->
  <rect x="436" y="622" width="368" height="40" rx="6" fill="#FBAF42"/>
  <text x="620" y="647" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="middle">Next</text>

  <!-- ===================== CALLOUT MARKERS ===================== -->
  <!-- 1: step progress header -->
  <circle cx="846" cy="244" r="11" fill="#FBAF42"/><text x="846" y="248" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: invitation/license note -->
  <circle cx="846" cy="342" r="11" fill="#FBAF42"/><text x="846" y="346" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: E-mail (prefilled, read-only) -->
  <circle cx="846" cy="427" r="11" fill="#FBAF42"/><text x="846" y="431" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: Name field -->
  <circle cx="846" cy="495" r="11" fill="#FBAF42"/><text x="846" y="499" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: Password + rules -->
  <circle cx="846" cy="563" r="11" fill="#FBAF42"/><text x="846" y="567" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: submit -> org creation -->
  <circle cx="846" cy="642" r="11" fill="#FBAF42"/><text x="846" y="646" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ===================== CALLOUT LEGEND ===================== -->
  <text x="92" y="180" font-size="12.5" font-weight="700" fill="#1c1c1e">Annotations</text>
  <g font-size="11.5" fill="#2b2b2e">
    <circle cx="100" cy="206" r="9" fill="#FBAF42"/><text x="100" y="210" font-size="10" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
    <text x="118" y="210">Multi-step header &#8212; only one</text>
    <text x="118" y="226">step ("Account") is shown.</text>

    <circle cx="100" cy="254" r="9" fill="#FBAF42"/><text x="100" y="258" font-size="10" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
    <text x="118" y="258">Invitation note: org, hosting</text>
    <text x="118" y="274">type &amp; plan from the invite.</text>

    <circle cx="100" cy="302" r="9" fill="#FBAF42"/><text x="100" y="306" font-size="10" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
    <text x="118" y="306">E-mail prefilled &amp; read-only</text>
    <text x="118" y="322">(bound to the invitation).</text>

    <circle cx="100" cy="350" r="9" fill="#FBAF42"/><text x="100" y="354" font-size="10" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
    <text x="118" y="354">Name (2&#8211;255 chars, required).</text>

    <circle cx="100" cy="390" r="9" fill="#FBAF42"/><text x="100" y="394" font-size="10" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
    <text x="118" y="394">Password &#8212; min 12, upper +</text>
    <text x="118" y="410">lower + number + special.</text>

    <circle cx="100" cy="438" r="9" fill="#FBAF42"/><text x="100" y="442" font-size="10" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>
    <text x="118" y="442">Submit registers the user, then</text>
    <text x="118" y="458">redirects to /organizations/create.</text>
  </g>
</svg>
