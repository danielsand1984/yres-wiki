<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Account / Settings</text>
  <!-- env switcher (top-right) -->
  <rect x="940" y="14" width="170" height="28" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="954" y="32" font-size="12" fill="#2b2b2e">Acme B.V. &#183; Productie &#9662;</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- NOTE: rail "none" -> no left icon rail; centered card per kit auth convention -->

  <!-- page title (kept left-aligned per frame) -->
  <text x="92" y="92" font-size="20" font-weight="700" fill="#1c1c1e">User settings</text>
  <text x="92" y="114" font-size="12.5" fill="#8a9196">Edit your own profile and password &#183; available in every scope</text>

  <!-- MAIN: centered settings card -->
  <!-- card -->
  <rect x="408" y="150" width="424" height="600" rx="8" fill="#ffffff" stroke="#e3e8ea"/>

  <!-- card header: title + dark-mode control -->
  <text x="436" y="190" font-size="18" font-weight="700" fill="#1c1c1e">Settings</text>
  <!-- dark-mode toggle (Sun / Moon) -->
  <rect x="730" y="174" width="72" height="26" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <line x1="766" y1="178" x2="766" y2="196" stroke="#e3e8ea"/>
  <circle cx="748" cy="187" r="5" fill="#FBAF42"/>
  <g stroke="#e89a1f" stroke-width="1"><line x1="748" y1="178" x2="748" y2="180"/><line x1="748" y1="194" x2="748" y2="196"/><line x1="739" y1="187" x2="741" y2="187"/><line x1="755" y1="187" x2="757" y2="187"/></g>
  <path d="M788 182 a6 6 0 1 0 0 10 a4.5 4.5 0 0 1 0 -10 z" fill="#8a9196"/>

  <!-- ============ FORM 1: Update profile ============ -->
  <text x="436" y="232" font-size="13" font-weight="700" fill="#2b2b2e">Update profile</text>
  <line x1="436" y1="242" x2="804" y2="242" stroke="#e3e8ea"/>

  <!-- Name -->
  <text x="436" y="262" font-size="11" fill="#8a9196">Name</text>
  <rect x="436" y="268" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="448" y="289" font-size="12.5" fill="#2b2b2e">Jane Doe</text>

  <!-- Timezone (combobox) -->
  <text x="436" y="324" font-size="11" fill="#8a9196">Timezone</text>
  <rect x="436" y="330" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="448" y="351" font-size="12.5" fill="#2b2b2e">Europe/Amsterdam</text>
  <text x="788" y="352" font-size="12" fill="#8a9196">&#9662;</text>

  <!-- Date format (combobox) -->
  <text x="436" y="386" font-size="11" fill="#8a9196">Date format</text>
  <rect x="436" y="392" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="448" y="413" font-size="12.5" fill="#2b2b2e">dd-MM-yyyy</text>
  <text x="788" y="414" font-size="12" fill="#8a9196">&#9662;</text>

  <!-- Language (combobox en/nl/de) -->
  <text x="436" y="448" font-size="11" fill="#8a9196">Language</text>
  <rect x="436" y="454" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="448" y="475" font-size="12.5" fill="#2b2b2e">nl</text>
  <text x="788" y="476" font-size="12" fill="#8a9196">&#9662;</text>
  <text x="688" y="475" font-size="10.5" fill="#8a9196">en &#183; nl &#183; de</text>

  <!-- Update button -->
  <rect x="704" y="500" width="100" height="32" rx="6" fill="#FBAF42"/>
  <text x="754" y="520" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Update</text>

  <!-- ============ FORM 2: Change password ============ -->
  <text x="436" y="566" font-size="13" font-weight="700" fill="#2b2b2e">Change password</text>
  <line x1="436" y1="576" x2="804" y2="576" stroke="#e3e8ea"/>

  <!-- Current password -->
  <text x="436" y="596" font-size="11" fill="#8a9196">Current password</text>
  <rect x="436" y="602" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="448" y="624" font-size="13" fill="#8a9196">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>

  <!-- New password (min 12) -->
  <text x="436" y="658" font-size="11" fill="#8a9196">New password</text>
  <rect x="436" y="664" width="368" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="448" y="686" font-size="13" fill="#8a9196">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
  <text x="688" y="660" font-size="10" fill="#8a9196">min 12 chars</text>

  <!-- Confirm password -->
  <text x="436" y="720" font-size="11" fill="#8a9196">Confirm password</text>
  <rect x="436" y="726" width="248" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="448" y="748" font-size="13" fill="#8a9196">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>

  <!-- Change button -->
  <rect x="704" y="726" width="100" height="32" rx="6" fill="#FBAF42"/>
  <text x="754" y="746" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Change</text>

  <!-- ================= CALLOUT MARKERS ================= -->
  <!-- 1: profile form fields -->
  <circle cx="436" cy="232" r="11" fill="#FBAF42"/><text x="436" y="236" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: language en/nl/de combobox -->
  <circle cx="824" cy="471" r="11" fill="#FBAF42"/><text x="824" y="475" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: Update button -->
  <circle cx="824" cy="516" r="11" fill="#FBAF42"/><text x="824" y="520" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: password form (min 12) -->
  <circle cx="436" cy="566" r="11" fill="#FBAF42"/><text x="436" y="570" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: Change button -->
  <circle cx="824" cy="742" r="11" fill="#FBAF42"/><text x="824" y="746" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: dark-mode toggle in container -->
  <circle cx="816" cy="178" r="11" fill="#FBAF42"/><text x="816" y="182" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ================= LEGEND ================= -->
  <rect x="92" y="150" width="288" height="248" rx="8" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="108" y="176" font-size="13" font-weight="700" fill="#1c1c1e">Callouts</text>
  <g font-size="11.5" fill="#2b2b2e">
    <circle cx="116" cy="200" r="9" fill="#FBAF42"/><text x="116" y="204" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
    <text x="134" y="204">Profile form: Name, Timezone,</text>
    <text x="134" y="218" fill="#8a9196">Date format, Language</text>

    <circle cx="116" cy="240" r="9" fill="#FBAF42"/><text x="116" y="244" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
    <text x="134" y="244">Language combobox (en / nl / de)</text>

    <circle cx="116" cy="270" r="9" fill="#FBAF42"/><text x="116" y="274" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
    <text x="134" y="274">&#8220;Update&#8221; &#8594; PUT /user/profile-information</text>

    <circle cx="116" cy="300" r="9" fill="#FBAF42"/><text x="116" y="304" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
    <text x="134" y="304">Password form: Current / New (min 12) /</text>
    <text x="134" y="318" fill="#8a9196">Confirm (must match)</text>

    <circle cx="116" cy="340" r="9" fill="#FBAF42"/><text x="116" y="344" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
    <text x="134" y="344">&#8220;Change&#8221; &#8594; PUT /user/password</text>

    <circle cx="116" cy="370" r="9" fill="#FBAF42"/><text x="116" y="374" font-size="11" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>
    <text x="134" y="374">Dark-mode toggle (container control)</text>
  </g>
</svg>
