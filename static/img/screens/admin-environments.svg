<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Admin / Update environments</text>
  <rect x="940" y="14" width="170" height="28" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="954" y="32" font-size="12" fill="#2b2b2e">Acme B.V. · Productie ▾</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="393" fill="#1c1c1e">Admin</text></g>
  </g>

  <!-- sub-sidebar (Admin) -->
  <rect x="68" y="56" width="168" height="744" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="84" y="84" font-size="11" font-weight="700" fill="#8a9196" letter-spacing="0.5">ADMIN</text>
  <g font-size="11.5" fill="#5b6166">
    <text x="84" y="110">Panel</text>
    <text x="84" y="134">Announcements</text>
  </g>
  <rect x="72" y="146" width="160" height="26" rx="6" fill="#FEF1DD"/><rect x="72" y="146" width="3" height="26" fill="#FBAF42"/>
  <text x="84" y="163" font-size="11.5" font-weight="600" fill="#e89a1f">Update environments</text>
  <g font-size="11.5" fill="#5b6166">
    <text x="84" y="196">Rebuild</text>
    <text x="84" y="220">Theme</text>
    <text x="84" y="244">Audit logs</text>
    <text x="84" y="268">Secrets</text>
    <text x="84" y="292">Firewall</text>
    <text x="84" y="316">Settings</text>
  </g>
  <text x="84" y="346" font-size="10" font-weight="700" fill="#8a9196" letter-spacing="0.5">ENVIRONMENT ADMIN</text>
  <g font-size="11.5" fill="#5b6166">
    <text x="84" y="370">DWH logs</text>
    <text x="84" y="394">Health checks</text>
    <text x="84" y="418">Azure resources</text>
    <text x="84" y="442">DWH settings</text>
  </g>

  <!-- page title -->
  <text x="260" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Update environment</text>
  <text x="260" y="114" font-size="12.5" fill="#8a9196">Update IRIS DWH and publish data factory · route /admin/environments</text>

  <!-- ============ ENVIRONMENT CARDS ROW (dev / test / prod) ============ -->

  <!-- DEV card (up to date) -->
  <rect x="260" y="150" width="300" height="244" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="284" y="190" font-size="20" font-weight="700" fill="#1c1c1e">dev</text>
  <rect x="284" y="204" width="160" height="22" rx="4" fill="#e6f4ea"/>
  <text x="294" y="219" font-size="11" fill="#2f9e44">Already up to date</text>
  <line x1="284" y1="242" x2="536" y2="242" stroke="#eef3f4"/>
  <g font-size="11.5" fill="#5b6166">
    <text x="284" y="272">Last update</text>
    <text x="284" y="300">IRIS DWH version</text>
    <text x="284" y="328">State</text>
    <text x="284" y="356">Results</text>
    <text x="284" y="384">Ran</text>
  </g>
  <g font-size="11.5" fill="#2b2b2e">
    <text x="430" y="300" font-weight="600">1.56</text>
    <text x="430" y="328">completed</text>
    <text x="430" y="384">15-06-2026</text>
  </g>
  <rect x="430" y="342" width="76" height="18" rx="4" fill="#e6f4ea"/>
  <text x="438" y="355" font-size="10.5" fill="#2f9e44">succeeded</text>

  <!-- TEST card (update available) -->
  <rect x="586" y="150" width="300" height="244" rx="8" fill="#ffffff" stroke="#FBAF42" stroke-width="2"/>
  <text x="610" y="190" font-size="20" font-weight="700" fill="#1c1c1e">test</text>
  <rect x="610" y="204" width="246" height="22" rx="4" fill="#FEF1DD"/>
  <text x="620" y="219" font-size="11" fill="#e89a1f">Click to update test to 1.56</text>
  <line x1="610" y1="242" x2="862" y2="242" stroke="#eef3f4"/>
  <g font-size="11.5" fill="#5b6166">
    <text x="610" y="272">Last update</text>
    <text x="610" y="300">IRIS DWH version</text>
    <text x="610" y="328">State</text>
    <text x="610" y="356">Results</text>
    <text x="610" y="384">Ran</text>
  </g>
  <g font-size="11.5" fill="#2b2b2e">
    <text x="756" y="300" font-weight="600">1.54</text>
    <text x="756" y="328">completed</text>
    <text x="756" y="384">02-06-2026</text>
  </g>
  <rect x="756" y="342" width="76" height="18" rx="4" fill="#e6f4ea"/>
  <text x="764" y="355" font-size="10.5" fill="#2f9e44">succeeded</text>

  <!-- PROD card (blocked: previous env behind) -->
  <rect x="912" y="150" width="300" height="244" rx="8" fill="#f8f9fa" stroke="#e3e8ea"/>
  <text x="936" y="190" font-size="20" font-weight="700" fill="#8a9196">prod</text>
  <rect x="936" y="204" width="252" height="22" rx="4" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="946" y="219" font-size="11" fill="#8a9196">Update previous environment first</text>
  <line x1="936" y1="242" x2="1188" y2="242" stroke="#eef3f4"/>
  <g font-size="11.5" fill="#5b6166">
    <text x="936" y="272">Last update</text>
    <text x="936" y="300">IRIS DWH version</text>
    <text x="936" y="328">State</text>
    <text x="936" y="356">Results</text>
    <text x="936" y="384">Ran</text>
  </g>
  <g font-size="11.5" fill="#2b2b2e">
    <text x="1082" y="300" font-weight="600">1.54</text>
    <text x="1082" y="328">completed</text>
    <text x="1082" y="384">28-05-2026</text>
  </g>
  <rect x="1082" y="342" width="76" height="18" rx="4" fill="#e6f4ea"/>
  <text x="1090" y="355" font-size="10.5" fill="#2f9e44">succeeded</text>

  <!-- ============ DEPLOY CONFIRM MODAL ============ -->
  <rect x="430" y="432" width="430" height="272" rx="10" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="430" y="432" width="430" height="40" rx="10" fill="#FEF1DD"/><rect x="430" y="462" width="430" height="10" fill="#FEF1DD"/>
  <text x="450" y="458" font-size="14" font-weight="700" fill="#1c1c1e">Deploy</text>
  <text x="844" y="458" font-size="14" fill="#8a9196" text-anchor="end">✕</text>

  <!-- warning band (sets DB tier to default) -->
  <rect x="450" y="490" width="390" height="56" rx="6" fill="#fff4e6"/>
  <circle cx="476" cy="518" r="13" fill="#ffffff" stroke="#f59f00"/><text x="476" y="523" font-size="14" font-weight="700" fill="#f08c00" text-anchor="middle">!</text>
  <text x="500" y="514" font-size="11" fill="#a05a00">Updating resets the database tier to the</text>
  <text x="500" y="530" font-size="11" fill="#a05a00">configured default (DefaultServiceTier).</text>

  <text x="450" y="578" font-size="13" fill="#2b2b2e">Are you sure you want update test?</text>

  <text x="450" y="614" font-size="11" fill="#8a9196">On confirm → POST /environments/{id}/updateDwh</text>
  <text x="450" y="630" font-size="11" fill="#8a9196">→ redirect to /deployments/{uuid}/status</text>

  <!-- modal buttons -->
  <rect x="660" y="654" width="84" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/><text x="702" y="676" font-size="12.5" font-weight="600" fill="#2b2b2e" text-anchor="middle">cancel</text>
  <rect x="756" y="654" width="84" height="34" rx="6" fill="#FBAF42"/><text x="798" y="676" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">yes</text>

  <!-- ============ NUMBERED CALLOUT MARKERS ============ -->
  <circle cx="284" cy="180" r="11" fill="#FBAF42"/><text x="284" y="184" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <circle cx="500" cy="300" r="11" fill="#FBAF42"/><text x="500" y="304" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <circle cx="610" cy="215" r="11" fill="#FBAF42"/><text x="610" y="219" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <circle cx="936" cy="215" r="11" fill="#FBAF42"/><text x="936" y="219" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <circle cx="476" cy="518" r="11" fill="#FBAF42"/><text x="476" y="522" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <circle cx="798" cy="671" r="11" fill="#FBAF42"/><text x="798" y="675" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ============ CALLOUTS LEGEND ============ -->
  <g font-size="10.5" fill="#2b2b2e">
    <rect x="80" y="470" width="158" height="290" rx="8" fill="#f6f9f9" stroke="#e3e8ea"/>
    <text x="92" y="492" font-size="11" font-weight="700" fill="#1c1c1e">Callouts</text>
    <circle cx="98" cy="514" r="8" fill="#FBAF42"/><text x="98" y="518" font-size="10" font-weight="700" text-anchor="middle">1</text><text x="114" y="512">One card per</text><text x="114" y="524">environment</text>
    <circle cx="98" cy="550" r="8" fill="#FBAF42"/><text x="98" y="554" font-size="10" font-weight="700" text-anchor="middle">2</text><text x="114" y="548">IRIS DWH version +</text><text x="114" y="560">State/Results/Ran</text>
    <circle cx="98" cy="586" r="8" fill="#FBAF42"/><text x="98" y="590" font-size="10" font-weight="700" text-anchor="middle">3</text><text x="114" y="584">"Click to update"</text><text x="114" y="596">when behind</text>
    <circle cx="98" cy="622" r="8" fill="#FBAF42"/><text x="98" y="626" font-size="10" font-weight="700" text-anchor="middle">4</text><text x="114" y="620">"Update previous</text><text x="114" y="632">environment first"</text>
    <circle cx="98" cy="658" r="8" fill="#FBAF42"/><text x="98" y="662" font-size="10" font-weight="700" text-anchor="middle">5</text><text x="114" y="656">Deploy modal +</text><text x="114" y="668">DB-tier warning</text>
    <circle cx="98" cy="694" r="8" fill="#FBAF42"/><text x="98" y="698" font-size="10" font-weight="700" text-anchor="middle">6</text><text x="114" y="692">Confirm "yes" →</text><text x="114" y="704">deployment status</text>
  </g>
</svg>
