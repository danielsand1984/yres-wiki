<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Data sources › AFAS_Prod › Used tables</text>
  <!-- env switcher (top-right) -->
  <rect x="940" y="14" width="170" height="28" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="954" y="32" font-size="12" fill="#2b2b2e">Acme B.V. · Productie ▾</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>

  <!-- left icon rail (sections); Sources active -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="161" fill="#1c1c1e">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="219" fill="#8a9196">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
  </g>

  <!-- page title -->
  <text x="92" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Add table to a source</text>
  <text x="92" y="114" font-size="12.5" fill="#8a9196">Multi-step wizard — pick a source table, columns, load type &amp; key, then confirm</text>

  <!-- ================= DIMMED BACKDROP (Used tables screen behind the modal) ================= -->
  <g opacity="0.42">
    <!-- metadata pipeline card -->
    <rect x="92" y="140" width="1108" height="58" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
    <text x="110" y="166" font-size="12.5" font-weight="600" fill="#2b2b2e">GetMetaData - AFAS_Prod</text>
    <text x="110" y="184" font-size="11" fill="#8a9196">Last run 24-06 06:00 · Status Succeeded · open in ADF ↗</text>
    <rect x="956" y="156" width="118" height="26" rx="6" fill="#ffffff" stroke="#e3e8ea"/><text x="966" y="173" font-size="11" fill="#2b2b2e">Refresh metadata</text>
    <rect x="1082" y="156" width="106" height="26" rx="6" fill="#FBAF42"/><text x="1092" y="173" font-size="11" font-weight="600" fill="#1c1c1e">Load data (all)</text>
    <!-- used tables grid header -->
    <rect x="92" y="210" width="1108" height="34" fill="#eef3f4"/>
    <text x="108" y="231" font-size="11.5" font-weight="600" fill="#5b6166">SourceSchema</text>
    <text x="250" y="231" font-size="11.5" font-weight="600" fill="#5b6166">SourceTable</text>
    <text x="430" y="231" font-size="11.5" font-weight="600" fill="#5b6166">DataPlatform</text>
    <text x="600" y="231" font-size="11.5" font-weight="600" fill="#5b6166">LoadType</text>
    <text x="740" y="231" font-size="11.5" font-weight="600" fill="#5b6166">DeltaColumn</text>
    <text x="900" y="231" font-size="11.5" font-weight="600" fill="#5b6166">TargetTable</text>
    <g font-size="11" fill="#2b2b2e">
      <text x="108" y="266">Financieel</text><text x="250" y="266">Debiteuren</text><text x="430" y="266">DWH, DL</text><text x="600" y="266">DELTA</text><text x="740" y="266">MutatieDatum</text><text x="900" y="266">AFAS_FIN_DEBITEUREN</text>
      <text x="108" y="298">Verkoop</text><text x="250" y="298">Orderregels</text><text x="430" y="298">DWH</text><text x="600" y="298">FULL</text><text x="740" y="298">—</text><text x="900" y="298">AFAS_VRK_ORDERREGELS</text>
    </g>
  </g>
  <rect x="68" y="56" width="1172" height="744" fill="#1c1c1e" opacity="0.30"/>

  <!-- ================= MODAL: Add table ================= -->
  <rect x="300" y="96" width="640" height="660" rx="10" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- modal header -->
  <rect x="300" y="96" width="640" height="48" rx="10" fill="#ffffff" stroke="#e3e8ea"/>
  <rect x="300" y="120" width="640" height="24" fill="#ffffff"/>
  <text x="324" y="126" font-size="15" font-weight="700" fill="#1c1c1e">Create table</text>
  <text x="916" y="127" font-size="16" fill="#8a9196" text-anchor="end">✕</text>
  <line x1="300" y1="144" x2="940" y2="144" stroke="#e3e8ea"/>

  <!-- ===== Stepper (7 steps) ===== -->
  <!-- connecting line -->
  <line x1="345" y1="178" x2="895" y2="178" stroke="#e3e8ea" stroke-width="2"/>
  <!-- step 1 done -->
  <circle cx="345" cy="178" r="12" fill="#ffffff" stroke="#FBAF42" stroke-width="2"/><path d="M340 178l4 4 7-8" fill="none" stroke="#e89a1f" stroke-width="2"/>
  <text x="345" y="205" font-size="9" text-anchor="middle" fill="#8a9196">Project</text>
  <!-- step 2 done -->
  <circle cx="437" cy="178" r="12" fill="#ffffff" stroke="#FBAF42" stroke-width="2"/><path d="M432 178l4 4 7-8" fill="none" stroke="#e89a1f" stroke-width="2"/>
  <text x="437" y="205" font-size="9" text-anchor="middle" fill="#8a9196">Schema/table</text>
  <!-- step 3 active -->
  <circle cx="529" cy="178" r="13" fill="#FBAF42"/><text x="529" y="182" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1e">3</text>
  <text x="529" y="205" font-size="9" text-anchor="middle" font-weight="700" fill="#1c1c1e">Columns</text>
  <!-- step 4 future -->
  <circle cx="621" cy="178" r="12" fill="#f6f9f9" stroke="#e3e8ea" stroke-width="2"/><text x="621" y="182" font-size="11" text-anchor="middle" fill="#8a9196">4</text>
  <text x="621" y="205" font-size="9" text-anchor="middle" fill="#8a9196">Load type</text>
  <!-- step 5 future -->
  <circle cx="713" cy="178" r="12" fill="#f6f9f9" stroke="#e3e8ea" stroke-width="2"/><text x="713" y="182" font-size="11" text-anchor="middle" fill="#8a9196">5</text>
  <text x="713" y="205" font-size="9" text-anchor="middle" fill="#8a9196">Key column</text>
  <!-- step 6 future -->
  <circle cx="805" cy="178" r="12" fill="#f6f9f9" stroke="#e3e8ea" stroke-width="2"/><text x="805" y="182" font-size="11" text-anchor="middle" fill="#8a9196">6</text>
  <text x="805" y="205" font-size="9" text-anchor="middle" fill="#8a9196">Options</text>
  <!-- step 7 future -->
  <circle cx="895" cy="178" r="12" fill="#f6f9f9" stroke="#e3e8ea" stroke-width="2"/><text x="895" y="182" font-size="11" text-anchor="middle" fill="#8a9196">7</text>
  <text x="895" y="205" font-size="9" text-anchor="middle" fill="#8a9196">Overwrite</text>

  <line x1="300" y1="222" x2="940" y2="222" stroke="#eef3f4"/>

  <!-- ===== Step body: Select columns ===== -->
  <text x="324" y="248" font-size="13" font-weight="700" fill="#1c1c1e">Financieel.Debiteuren</text>
  <circle cx="468" cy="244" r="7" fill="#FEF1DD"/><text x="468" y="248" font-size="10" text-anchor="middle" fill="#1c7ed6">?</text>

  <!-- column table header -->
  <rect x="324" y="262" width="592" height="32" fill="#eef3f4"/>
  <!-- select-all checkbox -->
  <rect x="336" y="271" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a9196"/><path d="M339 278l3 3 5-6" fill="none" stroke="#2f9e44" stroke-width="2"/>
  <text x="368" y="282" font-size="11" font-weight="600" fill="#5b6166">RowHash</text>
  <text x="446" y="282" font-size="11" font-weight="600" fill="#5b6166">Name</text>
  <text x="620" y="282" font-size="11" font-weight="600" fill="#5b6166">SourceType</text>
  <text x="752" y="282" font-size="11" font-weight="600" fill="#5b6166">TargetType</text>
  <text x="860" y="282" font-size="11" font-weight="600" fill="#5b6166">Nullable</text>

  <!-- rows -->
  <!-- row 1: DebiteurId (key, locked-on) -->
  <rect x="336" y="304" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M339 311l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="385" y="304" width="14" height="14" rx="3" fill="#f6f9f9" stroke="#8a9196"/>
  <text x="446" y="315" font-size="11" fill="#2b2b2e">DebiteurId</text>
  <text x="620" y="315" font-size="11" fill="#8a9196">int</text>
  <rect x="752" y="304" width="92" height="20" rx="4" fill="#f6f9f9" stroke="#e3e8ea"/><text x="760" y="318" font-size="10.5" fill="#2b2b2e">int ▾</text>
  <text x="860" y="315" font-size="11" fill="#2b2b2e">No</text>
  <line x1="324" y1="330" x2="916" y2="330" stroke="#eef3f4"/>
  <!-- row 2: Naam -->
  <rect x="336" y="340" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M339 347l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="385" y="340" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M388 347l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <text x="446" y="351" font-size="11" fill="#2b2b2e">Naam</text>
  <text x="620" y="351" font-size="11" fill="#8a9196">nvarchar</text>
  <rect x="752" y="340" width="118" height="20" rx="4" fill="#FEF1DD" stroke="#e89a1f"/><text x="760" y="354" font-size="10.5" fill="#e89a1f">NVARCHAR(100) ▾</text>
  <text x="860" y="351" font-size="11" fill="#2b2b2e" opacity="0"> </text>
  <text x="876" y="351" font-size="11" fill="#2b2b2e">No</text>
  <line x1="324" y1="366" x2="916" y2="366" stroke="#eef3f4"/>
  <!-- row 3: Plaats -->
  <rect x="336" y="376" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M339 383l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="385" y="376" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M388 383l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <text x="446" y="387" font-size="11" fill="#2b2b2e">Plaats</text>
  <text x="620" y="387" font-size="11" fill="#8a9196">nvarchar</text>
  <rect x="752" y="376" width="92" height="20" rx="4" fill="#f6f9f9" stroke="#e3e8ea"/><text x="760" y="390" font-size="10.5" fill="#2b2b2e">nvarchar ▾</text>
  <text x="876" y="387" font-size="11" fill="#2b2b2e">Yes</text>
  <line x1="324" y1="402" x2="916" y2="402" stroke="#eef3f4"/>
  <!-- row 4: MutatieDatum -->
  <rect x="336" y="412" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M339 419l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="385" y="412" width="14" height="14" rx="3" fill="#f6f9f9" stroke="#8a9196"/>
  <text x="446" y="423" font-size="11" fill="#2b2b2e">MutatieDatum</text>
  <text x="620" y="423" font-size="11" fill="#8a9196">datetime2</text>
  <rect x="752" y="412" width="92" height="20" rx="4" fill="#f6f9f9" stroke="#e3e8ea"/><text x="760" y="426" font-size="10.5" fill="#2b2b2e">datetime2 ▾</text>
  <text x="876" y="423" font-size="11" fill="#2b2b2e">No</text>
  <line x1="324" y1="438" x2="916" y2="438" stroke="#eef3f4"/>
  <!-- row 5: Saldo -->
  <rect x="336" y="448" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M339 455l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="385" y="448" width="14" height="14" rx="3" fill="#FBAF42" stroke="#e89a1f"/><path d="M388 455l3 3 5-6" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <text x="446" y="459" font-size="11" fill="#2b2b2e">Saldo</text>
  <text x="620" y="459" font-size="11" fill="#8a9196">decimal</text>
  <rect x="752" y="448" width="118" height="20" rx="4" fill="#f6f9f9" stroke="#e3e8ea"/><text x="760" y="462" font-size="10.5" fill="#2b2b2e">decimal(18,2) ▾</text>
  <text x="876" y="459" font-size="11" fill="#2b2b2e">Yes</text>
  <line x1="324" y1="474" x2="916" y2="474" stroke="#eef3f4"/>
  <!-- row 6: rowhash (disallowed) -->
  <rect x="336" y="484" width="14" height="14" rx="3" fill="#e3e8ea" stroke="#c7ced1"/>
  <rect x="385" y="484" width="14" height="14" rx="3" fill="#e3e8ea" stroke="#c7ced1"/>
  <text x="446" y="495" font-size="11" fill="#e03131" text-decoration="line-through">rowhash</text>
  <text x="620" y="495" font-size="11" fill="#8a9196">binary</text>
  <rect x="752" y="484" width="92" height="20" rx="4" fill="#eef3f4" stroke="#e3e8ea"/><text x="760" y="498" font-size="10.5" fill="#8a9196">binary ▾</text>
  <text x="876" y="495" font-size="11" fill="#8a9196">No</text>
  <circle cx="490" cy="491" r="7" fill="#FEF1DD"/><text x="490" y="495" font-size="10" text-anchor="middle" fill="#1c7ed6">?</text>

  <!-- helper line -->
  <text x="324" y="528" font-size="11" fill="#8a9196">Orange RowHash boxes drive SCD2 change detection · reserved names (rowhash, etl_date…) are blocked</text>

  <!-- footer buttons -->
  <line x1="300" y1="700" x2="940" y2="700" stroke="#e3e8ea"/>
  <rect x="688" y="716" width="100" height="30" rx="6" fill="#ffffff" stroke="#e3e8ea"/><text x="738" y="735" font-size="12.5" font-weight="600" fill="#2b2b2e" text-anchor="middle">Previous</text>
  <rect x="800" y="716" width="116" height="30" rx="6" fill="#FBAF42"/><text x="858" y="735" font-size="12.5" font-weight="700" fill="#1c1c1e" text-anchor="middle">Next step</text>

  <!-- ================= CALLOUTS ================= -->
  <!-- (1) stepper -->
  <circle cx="529" cy="152" r="11" fill="#FBAF42"/><text x="529" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1e">1</text>
  <!-- (2) schema.table header -->
  <circle cx="312" cy="244" r="11" fill="#FBAF42"/><text x="312" y="248" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1e">2</text>
  <!-- (3) select-all + column checkboxes -->
  <circle cx="312" cy="278" r="11" fill="#FBAF42"/><text x="312" y="282" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1e">3</text>
  <!-- (4) RowHash column -->
  <circle cx="392" cy="282" r="11" fill="#FBAF42"/><text x="392" y="286" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1e">4</text>
  <!-- (5) TargetType override -->
  <circle cx="900" cy="350" r="11" fill="#FBAF42"/><text x="900" y="354" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1e">5</text>
  <!-- (6) Back/Next nav -->
  <circle cx="860" cy="696" r="11" fill="#FBAF42"/><text x="860" y="700" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1e">6</text>

  <!-- callout legend -->
  <rect x="92" y="560" width="196" height="184" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="106" y="582" font-size="11.5" font-weight="700" fill="#1c1c1e">Wizard steps</text>
  <g font-size="10" fill="#2b2b2e">
    <text x="106" y="602">1  7-step progress (Columns now)</text>
    <text x="106" y="622">2  Selected source table</text>
    <text x="106" y="642">3  Tick columns to load</text>
    <text x="106" y="662">4  RowHash = SCD2 tracked</text>
    <text x="106" y="682">5  Override TargetType / size</text>
    <text x="106" y="702">6  Back / Next advances</text>
    <text x="106" y="726" fill="#8a9196">Next → Load type · Key · Options</text>
  </g>
</svg>
