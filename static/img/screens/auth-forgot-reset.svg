<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>

  <!-- top bar (auth: minimal, no env switcher, no user avatar — user not yet set) -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Acme B.V. · Account access</text>

  <!-- page title -->
  <text x="92" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Forgot password</text>
  <text x="92" y="114" font-size="12.5" fill="#8a9196">Front scope (unauthenticated) · AuthFormContainer · centered card, no left rail · reset variant shown at right</text>

  <!-- soft auth surface band -->
  <rect x="92" y="140" width="1108" height="612" rx="12" fill="#f6f9f9" stroke="#e3e8ea"/>

  <!-- ================= CARD A — Forgot password (request reset email) /forgot-password ================= -->
  <!-- variant tag -->
  <rect x="220" y="170" width="226" height="22" rx="4" fill="#FEF1DD"/>
  <text x="333" y="185" font-size="10.5" font-weight="600" fill="#e89a1f" text-anchor="middle">Step 1 · /forgot-password</text>

  <!-- logo chip above card -->
  <circle cx="333" cy="234" r="25" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="333" cy="234" r="15" fill="#FBAF42"/><path d="M325 227l8 9 8-9h-5l-3 3.5-3-3.5z" fill="#1c1c1e"/><rect x="330" y="236" width="6" height="9" rx="2" fill="#1c1c1e"/>

  <rect x="193" y="248" width="280" height="340" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- card header -->
  <text x="333" y="284" font-size="16" font-weight="700" fill="#1c1c1e" text-anchor="middle">Forgot password</text>
  <line x1="221" y1="302" x2="445" y2="302" stroke="#e3e8ea"/>

  <!-- email field -->
  <text x="221" y="330" font-size="11" fill="#8a9196">Email</text>
  <rect x="221" y="338" width="224" height="34" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="233" y="359" font-size="12.5" fill="#8a9196">email</text>

  <!-- helper note -->
  <text x="221" y="394" font-size="10.5" fill="#8a9196">We email a reset link if the account exists.</text>

  <!-- submit -->
  <rect x="221" y="410" width="224" height="38" rx="6" fill="#FBAF42"/>
  <text x="333" y="434" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Reset password</text>

  <!-- success toast (POST /forgot-password) -->
  <rect x="221" y="460" width="224" height="34" rx="6" fill="#e6f4ea" stroke="#bfe3cc"/>
  <circle cx="237" cy="477" r="6" fill="#2f9e44"/><path d="M234 477l2 2 4-4" stroke="#ffffff" stroke-width="1.6" fill="none"/>
  <text x="250" y="481" font-size="10.5" fill="#2f9e44">Reset email sent if the account exists</text>

  <!-- bottom link -->
  <text x="221" y="568" font-size="11.5" fill="#1c7ed6" text-decoration="underline">Sign in</text>
  <text x="262" y="568" font-size="11.5" fill="#8a9196">→ /login</text>

  <!-- flow arrow between cards -->
  <line x1="478" y1="414" x2="760" y2="414" stroke="#e3e8ea" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M760 414l-9 -4v8z" fill="#8a9196"/>
  <text x="619" y="406" font-size="10.5" fill="#8a9196" text-anchor="middle">click email link</text>

  <!-- ================= CARD B — Reset password (set new password via emailed token) /reset-password/:token ================= -->
  <!-- variant tag -->
  <rect x="795" y="170" width="226" height="22" rx="4" fill="#FEF1DD"/>
  <text x="908" y="185" font-size="10.5" font-weight="600" fill="#e89a1f" text-anchor="middle">Step 2 · /reset-password/:token</text>

  <!-- logo chip above card -->
  <circle cx="908" cy="234" r="25" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="908" cy="234" r="15" fill="#FBAF42"/><path d="M900 227l8 9 8-9h-5l-3 3.5-3-3.5z" fill="#1c1c1e"/><rect x="905" y="236" width="6" height="9" rx="2" fill="#1c1c1e"/>

  <rect x="768" y="248" width="280" height="406" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- card header -->
  <text x="908" y="284" font-size="16" font-weight="700" fill="#1c1c1e" text-anchor="middle">Reset password</text>
  <line x1="796" y1="302" x2="1020" y2="302" stroke="#e3e8ea"/>

  <!-- token chip -->
  <rect x="796" y="314" width="224" height="24" rx="4" fill="#FEF1DD"/>
  <text x="808" y="330" font-size="10.5" fill="#e89a1f">token: 3f9a…c2 (from email link)</text>

  <!-- Email field -->
  <text x="796" y="358" font-size="11" fill="#8a9196">Email</text>
  <rect x="796" y="366" width="224" height="32" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="808" y="386" font-size="12.5" fill="#2b2b2e">jan.devries@acme.nl</text>

  <!-- Password field -->
  <text x="796" y="414" font-size="11" fill="#8a9196">Password</text>
  <rect x="796" y="422" width="224" height="32" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="808" y="442" font-size="13" fill="#8a9196" letter-spacing="1.5">••••••••••••</text>
  <text x="796" y="468" font-size="10" fill="#8a9196">Min 12, max 50 characters.</text>

  <!-- Confirm Password field -->
  <text x="796" y="492" font-size="11" fill="#8a9196">Confirm Password</text>
  <rect x="796" y="500" width="224" height="32" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="808" y="520" font-size="13" fill="#8a9196" letter-spacing="1.5">••••••••••••</text>
  <text x="796" y="546" font-size="10" fill="#8a9196">Must match the password above.</text>

  <!-- server-error banner area -->
  <rect x="796" y="558" width="224" height="30" rx="6" fill="#fde8e8" stroke="#f3c2c2"/>
  <circle cx="811" cy="573" r="6" fill="#e03131"/><text x="811" y="577" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="824" y="577" font-size="10.5" fill="#e03131">Invalid or expired reset token</text>

  <!-- submit -->
  <rect x="796" y="600" width="224" height="38" rx="6" fill="#FBAF42"/>
  <text x="908" y="624" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Reset password</text>

  <!-- "Powered by" footer badge (bottom-right, per AuthFormContainer) -->
  <rect x="1040" y="700" width="148" height="38" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1052" y="724" font-size="11" font-weight="600" fill="#8a9196">Powered by</text>
  <circle cx="1158" cy="719" r="11" fill="#FBAF42"/><path d="M1152 715l6 7 6-7h-3.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="1155.5" y="721" width="4" height="6" rx="1.5" fill="#1c1c1e"/>

  <!-- ===================== CALLOUT MARKERS ===================== -->
  <!-- 1: email field (request) -->
  <circle cx="455" cy="355" r="11" fill="#FBAF42"/><text x="455" y="359" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2: submit (request reset) -->
  <circle cx="455" cy="429" r="11" fill="#FBAF42"/><text x="455" y="433" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3: back-to-sign-in link -->
  <circle cx="333" cy="564" r="11" fill="#FBAF42"/><text x="333" y="568" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4: new password (min-12 rule) -->
  <circle cx="1030" cy="438" r="11" fill="#FBAF42"/><text x="1030" y="442" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5: confirm password (match rule) -->
  <circle cx="1030" cy="516" r="11" fill="#FBAF42"/><text x="1030" y="520" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6: server-error area + submit -->
  <circle cx="1030" cy="573" r="11" fill="#FBAF42"/><text x="1030" y="577" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="193" y="604" width="280" height="130" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="209" y="626" font-size="11.5" font-weight="700" fill="#1c1c1e">Callouts</text>
  <text x="209" y="646" font-size="10.5" fill="#2b2b2e">1  Email field — POST /forgot-password</text>
  <text x="209" y="664" font-size="10.5" fill="#2b2b2e">2  "Reset password" submit (sends email)</text>
  <text x="209" y="682" font-size="10.5" fill="#2b2b2e">3  "Sign in" link → /login</text>
  <text x="209" y="700" font-size="10.5" fill="#2b2b2e">4  New Password — min 12, max 50</text>
  <text x="209" y="718" font-size="10.5" fill="#2b2b2e">5  Confirm Password — must match</text>
  <text x="209" y="730" font-size="10.5" fill="#2b2b2e" opacity="0"> </text>
  <text x="266" y="718" font-size="10.5" fill="#2b2b2e">· 6  Server error + submit</text>
</svg>
