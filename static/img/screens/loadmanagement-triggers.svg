<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1240" height="56" fill="#ffffff" stroke="#e3e8ea"/>
  <circle cx="92" cy="28" r="13" fill="#FBAF42"/><path d="M85 22l7 8 7-8h-4.5l-2.5 3-2.5-3z" fill="#1c1c1e"/><rect x="89.5" y="30" width="5" height="8" rx="2" fill="#1c1c1e"/>
  <text x="116" y="33" font-size="15" font-weight="700" fill="#1c1c1e">Yres</text>
  <text x="180" y="33" font-size="13" fill="#8a9196">Load management / Triggers</text>
  <!-- env switcher (top-right) -->
  <rect x="940" y="14" width="170" height="28" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="954" y="32" font-size="12" fill="#2b2b2e">Acme B.V. · Productie ▾</text>
  <circle cx="1140" cy="28" r="14" fill="#FEF1DD"/><text x="1140" y="32" font-size="11" fill="#e89a1f" text-anchor="middle">JD</text>
  <!-- left icon rail (sections) -->
  <rect x="0" y="56" width="68" height="744" fill="#f6f9f9" stroke="#e3e8ea"/>
  <g font-size="9" text-anchor="middle" fill="#8a9196">
    <g><rect x="14" y="78" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="103" fill="#8a9196">Home</text></g>
    <g><rect x="14" y="136" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="161" fill="#8a9196">Sources</text></g>
    <g><rect x="14" y="194" width="40" height="40" rx="9" fill="#FBAF42"/><text x="34" y="219" fill="#1c1c1e">Load</text></g>
    <g><rect x="14" y="252" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="277" fill="#8a9196">Engineer</text></g>
    <g><rect x="14" y="310" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="335" fill="#8a9196">Projects</text></g>
    <g><rect x="14" y="368" width="40" height="40" rx="9" fill="#f6f9f9"/><text x="34" y="393" fill="#8a9196">Admin</text></g>
  </g>
  <!-- page title -->
  <text x="92" y="92" font-size="20" font-weight="700" fill="#1c1c1e">Triggers</text>
  <text x="92" y="114" font-size="12.5" fill="#8a9196">Schedule when an ADF pipeline runs — list, start/stop, delete or create schedule triggers.</text>

  <!-- ================= MAIN ================= -->

  <!-- LEFT: pipeline list (PipelineList accordion) -->
  <rect x="92" y="140" width="270" height="554" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="108" y="166" font-size="12" font-weight="700" fill="#5b6166">Select pipeline</text>
  <line x1="92" y1="178" x2="362" y2="178" stroke="#eef3f4"/>

  <!-- folder: PW - Yres -->
  <rect x="104" y="190" width="246" height="30" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="118" y="209" font-size="11.5" font-weight="600" fill="#5b6166">▸ PW - Yres</text>

  <!-- folder: Master pipelines (expanded) -->
  <rect x="104" y="226" width="246" height="30" rx="6" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="118" y="245" font-size="11.5" font-weight="600" fill="#5b6166">▾ Master pipelines</text>
  <!-- selected pipeline -->
  <rect x="116" y="260" width="234" height="30" rx="6" fill="#FEF1DD" stroke="#FBAF42"/>
  <text x="130" y="279" font-size="11.5" font-weight="600" fill="#e89a1f">Master - Acme Daily Load</text>
  <rect x="116" y="294" width="234" height="28" rx="6" fill="#ffffff"/>
  <text x="130" y="312" font-size="11.5" fill="#2b2b2e">Master - Weekly Rebuild</text>

  <!-- root pipelines -->
  <rect x="104" y="332" width="246" height="28" rx="6" fill="#ffffff"/>
  <text x="118" y="350" font-size="11.5" fill="#2b2b2e">Dynamic Workflow YRES</text>
  <rect x="104" y="364" width="246" height="28" rx="6" fill="#ffffff"/>
  <text x="118" y="382" font-size="11.5" fill="#2b2b2e">GetMetaData - AFAS_Prod</text>
  <rect x="104" y="396" width="246" height="28" rx="6" fill="#ffffff"/>
  <text x="118" y="414" font-size="11.5" fill="#2b2b2e">GetMetaData - ExactOnline</text>
  <rect x="104" y="428" width="246" height="28" rx="6" fill="#ffffff"/>
  <text x="118" y="446" font-size="11.5" fill="#2b2b2e">Materialize View</text>

  <!-- RIGHT: triggers table -->
  <rect x="386" y="140" width="814" height="424" rx="8" fill="#ffffff" stroke="#e3e8ea"/>
  <!-- table title + create -->
  <text x="404" y="170" font-size="13.5" font-weight="700" fill="#1c1c1e">Triggers: Master - Acme Daily Load</text>
  <rect x="1066" y="153" width="118" height="30" rx="6" fill="#FBAF42"/>
  <text x="1125" y="172" font-size="12.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">+ Create</text>

  <!-- table header band -->
  <rect x="386" y="194" width="814" height="34" fill="#eef3f4"/>
  <text x="404" y="215" font-size="11.5" font-weight="600" fill="#5b6166">Name</text>
  <text x="600" y="215" font-size="11.5" font-weight="600" fill="#5b6166">status</text>
  <text x="700" y="215" font-size="11.5" font-weight="600" fill="#5b6166">frequency</text>
  <text x="860" y="215" font-size="11.5" font-weight="600" fill="#5b6166">on</text>
  <text x="950" y="215" font-size="11.5" font-weight="600" fill="#5b6166">time</text>
  <text x="1010" y="215" font-size="11.5" font-weight="600" fill="#5b6166">timezone</text>
  <text x="1130" y="215" font-size="11.5" font-weight="600" fill="#5b6166">actions</text>

  <!-- row 1 -->
  <rect x="386" y="228" width="814" height="40" fill="#ffffff"/>
  <line x1="386" y1="268" x2="1200" y2="268" stroke="#eef3f4"/>
  <text x="404" y="253" font-size="11.5" fill="#2b2b2e">Daily 06:00 — Acme STAGE→HIS</text>
  <rect x="600" y="240" width="64" height="18" rx="4" fill="#e6f4ea"/>
  <text x="632" y="253" font-size="10.5" fill="#2f9e44" text-anchor="middle">Started</text>
  <text x="700" y="253" font-size="11.5" fill="#2b2b2e">Every 1 Day(s)</text>
  <text x="860" y="253" font-size="11.5" fill="#8a9196">—</text>
  <text x="950" y="253" font-size="11.5" fill="#2b2b2e">06:00</text>
  <text x="1010" y="253" font-size="11" fill="#2b2b2e">UTC+1</text>
  <!-- actions: stop / delete -->
  <circle cx="1140" cy="248" r="8" fill="#fde8e8"/><rect x="1137" y="245" width="6" height="6" fill="#e03131"/>
  <text x="1167" y="252" font-size="13" fill="#e03131" text-anchor="middle">×</text>

  <!-- row 2 (parameterized -> info icon) -->
  <rect x="386" y="268" width="814" height="40" fill="#f6f9f9"/>
  <line x1="386" y1="308" x2="1200" y2="308" stroke="#eef3f4"/>
  <text x="404" y="293" font-size="11.5" fill="#2b2b2e">ExactOnline hourly delta</text>
  <rect x="600" y="280" width="64" height="18" rx="4" fill="#e6f4ea"/>
  <text x="632" y="293" font-size="10.5" fill="#2f9e44" text-anchor="middle">Started</text>
  <text x="700" y="293" font-size="11.5" fill="#2b2b2e">Every 1 Hour(s)</text>
  <text x="860" y="293" font-size="11.5" fill="#8a9196">—</text>
  <text x="950" y="293" font-size="11.5" fill="#8a9196">—</text>
  <text x="1010" y="293" font-size="11" fill="#2b2b2e">UTC+1</text>
  <!-- actions: info / stop / delete -->
  <circle cx="1112" cy="288" r="8" fill="#e7f1fb"/><text x="1112" y="292" font-size="10" fill="#1c7ed6" text-anchor="middle">i</text>
  <circle cx="1140" cy="288" r="8" fill="#fde8e8"/><rect x="1137" y="285" width="6" height="6" fill="#e03131"/>
  <text x="1167" y="292" font-size="13" fill="#e03131" text-anchor="middle">×</text>

  <!-- row 3 (stopped -> start icon) -->
  <rect x="386" y="308" width="814" height="40" fill="#ffffff"/>
  <line x1="386" y1="348" x2="1200" y2="348" stroke="#eef3f4"/>
  <text x="404" y="333" font-size="11.5" fill="#2b2b2e">Weekly full — Expose refresh</text>
  <rect x="600" y="320" width="64" height="18" rx="4" fill="#f1f3f5"/>
  <text x="632" y="333" font-size="10.5" fill="#8a9196" text-anchor="middle">Stopped</text>
  <text x="700" y="333" font-size="11.5" fill="#2b2b2e">Every 1 Week(s)</text>
  <text x="860" y="333" font-size="11.5" fill="#2b2b2e">Monday</text>
  <text x="950" y="333" font-size="11.5" fill="#2b2b2e">02:30</text>
  <text x="1010" y="333" font-size="11" fill="#2b2b2e">UTC+1</text>
  <!-- actions: start (green) / delete -->
  <circle cx="1140" cy="328" r="8" fill="#e6f4ea"/><path d="M1137 324l6 4-6 4z" fill="#2f9e44"/>
  <text x="1167" y="332" font-size="13" fill="#e03131" text-anchor="middle">×</text>

  <!-- row 4 -->
  <rect x="386" y="348" width="814" height="40" fill="#f6f9f9"/>
  <line x1="386" y1="388" x2="1200" y2="388" stroke="#eef3f4"/>
  <text x="404" y="373" font-size="11.5" fill="#2b2b2e">Month-end SQL_CRM load</text>
  <rect x="600" y="360" width="64" height="18" rx="4" fill="#e6f4ea"/>
  <text x="632" y="373" font-size="10.5" fill="#2f9e44" text-anchor="middle">Started</text>
  <text x="700" y="373" font-size="11.5" fill="#2b2b2e">Every 1 Month(s)</text>
  <text x="860" y="373" font-size="11.5" fill="#2b2b2e">1</text>
  <text x="950" y="373" font-size="11.5" fill="#2b2b2e">04:00</text>
  <text x="1010" y="373" font-size="11" fill="#2b2b2e">UTC+1</text>
  <circle cx="1140" cy="368" r="8" fill="#fde8e8"/><rect x="1137" y="365" width="6" height="6" fill="#e03131"/>
  <text x="1167" y="372" font-size="13" fill="#e03131" text-anchor="middle">×</text>

  <!-- empty-state hint line -->
  <text x="404" y="416" font-size="11" fill="#8a9196">Only triggers whose first pipeline reference matches the selected pipeline are shown.</text>

  <!-- legend strip -->
  <rect x="386" y="436" width="814" height="112" rx="8" fill="#f6f9f9" stroke="#e3e8ea"/>
  <text x="404" y="458" font-size="11.5" font-weight="700" fill="#5b6166">Row actions</text>
  <circle cx="412" cy="480" r="8" fill="#e6f4ea"/><path d="M409 476l6 4-6 4z" fill="#2f9e44"/>
  <text x="428" y="484" font-size="11" fill="#2b2b2e">Start (when stopped)</text>
  <circle cx="412" cy="506" r="8" fill="#fde8e8"/><rect x="409" y="503" width="6" height="6" fill="#e03131"/>
  <text x="428" y="510" font-size="11" fill="#2b2b2e">Stop (when running)</text>
  <text x="650" y="484" font-size="13" fill="#e03131">×</text>
  <text x="668" y="484" font-size="11" fill="#2b2b2e">Delete trigger</text>
  <circle cx="657" cy="503" r="8" fill="#e7f1fb"/><text x="657" y="507" font-size="10" fill="#1c7ed6" text-anchor="middle">i</text>
  <text x="672" y="510" font-size="11" fill="#2b2b2e">Info — parameterized triggers only</text>

  <!-- ===== Create trigger modal (overlay, SchedulePipelineStep) ===== -->
  <rect x="744" y="582" width="456" height="200" rx="8" fill="#ffffff" stroke="#FBAF42" stroke-width="1.5"/>
  <text x="764" y="606" font-size="13" font-weight="700" fill="#1c1c1e">Create trigger</text>
  <text x="764" y="624" font-size="10.5" fill="#8a9196">Timezone UTC(+1) will be used</text>
  <!-- Name -->
  <text x="764" y="644" font-size="10.5" fill="#8a9196">Name</text>
  <rect x="764" y="648" width="416" height="28" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="774" y="666" font-size="11" fill="#2b2b2e">Daily 06:00 — Acme STAGE→HIS</text>
  <!-- Every / Frequency / Time -->
  <text x="764" y="694" font-size="10.5" fill="#8a9196">Every</text>
  <rect x="764" y="698" width="120" height="28" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="774" y="716" font-size="11" fill="#2b2b2e">1</text>
  <text x="900" y="694" font-size="10.5" fill="#8a9196">Frequency</text>
  <rect x="900" y="698" width="120" height="28" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="910" y="716" font-size="11" fill="#2b2b2e">Day(s) ▾</text>
  <text x="1036" y="694" font-size="10.5" fill="#8a9196">Time</text>
  <rect x="1036" y="698" width="80" height="28" rx="6" fill="#ffffff" stroke="#e3e8ea"/>
  <text x="1046" y="716" font-size="11" fill="#2b2b2e">06:00</text>
  <rect x="1124" y="698" width="56" height="28" rx="6" fill="#FBAF42"/>
  <text x="1152" y="716" font-size="11.5" font-weight="600" fill="#1c1c1e" text-anchor="middle">Save</text>
  <text x="764" y="748" font-size="10" fill="#8a9196">Frequency = Week(s) → "Day of the week"; Month(s) → "Day of the month".</text>
  <text x="764" y="764" font-size="10" fill="#8a9196">Parameterized pipeline (Dynamic Workflow YRES) adds a Source/Schema/Table step.</text>

  <!-- ================= CALLOUTS ================= -->
  <!-- 1 pipeline list -->
  <circle cx="100" cy="276" r="11" fill="#FBAF42"/><text x="100" y="280" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <!-- 2 triggers table header -->
  <circle cx="700" cy="194" r="11" fill="#FBAF42"/><text x="700" y="198" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <!-- 3 start/stop toggle -->
  <circle cx="1140" cy="328" r="11" fill="#FBAF42"/><text x="1140" y="332" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <!-- 4 delete -->
  <circle cx="1182" cy="248" r="11" fill="#FBAF42"/><text x="1182" y="252" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <!-- 5 create -->
  <circle cx="1042" cy="168" r="11" fill="#FBAF42"/><text x="1042" y="172" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <!-- 6 info modal -->
  <circle cx="1112" cy="288" r="11" fill="#FBAF42"/><text x="1112" y="292" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- callout legend -->
  <g font-size="11" fill="#2b2b2e">
    <text x="92" y="724" font-weight="700" fill="#1c1c1e">Callouts</text>
    <text x="92" y="744">(1) Pipeline list — pick a pipeline; triggers below are filtered to it.  (2) Triggers table: Name / status / frequency / on / time / timezone.</text>
    <text x="92" y="762">(3) Start / Stop toggle (per runtimeState).  (4) Delete trigger.  (5) Create → schedule wizard (Name, Every, Frequency, Time).</text>
    <text x="92" y="780">(6) Info modal — shown only for parameterized triggers (e.g. Dynamic Workflow YRES with Source/Schema/Table).</text>
  </g>
</svg>
