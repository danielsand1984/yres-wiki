    <text x="234" y="730" font-weight="700" fill="#1c1c1e">Callouts</text>
    <text x="234" y="748">1 &#183; "Generate Typemapping" dispatches runGenerateTypeMapping to seed default rules.</text>
    <text x="234" y="762">2 &#183; Source-scoped to AFAS_Prod.   3 &#183; Editor filters WHERE SourceSystem = source.name.   4 &#183; Inline-edit a cell (targetDataType).</text>
    <text x="234" y="776">5 &#183; update commits edited rows to LoadManagement.TypeMapping.   6 &#183; overwriteLength / maxThreshold tune column sizing for STAGE &#8594; HIS.</text>
  </g>
