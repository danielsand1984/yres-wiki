  <!-- ===================== CALLOUTS ===================== -->
  <circle cx="420" cy="170" r="11" fill="#FBAF42"/><text x="420" y="174" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">1</text>
  <circle cx="342" cy="144" r="11" fill="#FBAF42"/><text x="342" y="148" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">2</text>
  <circle cx="662" cy="296" r="11" fill="#FBAF42"/><text x="662" y="300" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">3</text>
  <circle cx="642" cy="448" r="11" fill="#FBAF42"/><text x="642" y="452" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">4</text>
  <circle cx="972" cy="247" r="11" fill="#FBAF42"/><text x="972" y="251" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">5</text>
  <circle cx="912" cy="560" r="11" fill="#FBAF42"/><text x="912" y="564" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">6</text>

  <!-- callout legend -->
